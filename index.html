// Box di configurazione/stato della sincronizzazione su Google Sheet. Il form (URL Web App + token)
// è nascosto di default dietro "Configura sincronizzazione" per non ingombrare l'interfaccia a chi
// non la usa; una volta connesso mostra solo lo stato ("Sincronizzato alle HH:MM" / "Offline" / errore).
function SyncBox({ syncConfig, syncStatus, syncError, mostraForm, setMostraForm, onSalva }) {
  const [url, setUrl] = useState(syncConfig.url);
  const [token, setToken] = useState(syncConfig.token);
  const connesso = !!(syncConfig.url && syncConfig.token);

  const statoTesto = {
    idle: "Non connesso — le appendici restano solo su questo browser",
    syncing: "Sincronizzazione in corso…",
    synced: "Sincronizzato con il foglio Google",
    error: `Errore di sincronizzazione${syncError ? ": " + syncError : ""} — le modifiche restano salvate in locale`,
    offline: "Offline — le modifiche restano salvate in locale",
  }[syncStatus] || "";

  return (
    <div className="sync-box no-print">
      <div className="sync-box-head">
        <span className={`sync-dot sync-dot-${connesso ? syncStatus : "idle"}`}></span>
        <span className="sync-box-stato">{connesso ? statoTesto : "Sincronizzazione appendici: non configurata"}</span>
        <button className="sync-toggle-btn" onClick={() => setMostraForm(!mostraForm)}>
          {mostraForm ? "Chiudi" : connesso ? "Modifica connessione" : "Configura sincronizzazione"}
        </button>
      </div>
      {mostraForm && (
        <div className="sync-box-form">
          <p className="hint" style={{ margin: "0 0 8px" }}>
            Incolla qui l'URL del Web App di Google Apps Script collegato al foglio dedicato e la chiave segreta
            impostata nello script. Solo le quattro appendici (Rendimenti storici, Gestioni Separate, Configurazione
            Prodotti, Costi Predefiniti) vengono sincronizzate — le schede prodotto restano locali, salvabili solo
            con "Esporta Configurazione".
          </p>
          <input
            type="text"
            className="prodcfg-text"
            placeholder="URL Web App (https://script.google.com/macros/s/.../exec)"
            value={url}
            onChange={(e) => setUrl(e.target.value)}
            style={{ width: "100%", marginBottom: 8 }}
          />
          <input
            type="password"
            className="prodcfg-text"
            placeholder="Chiave segreta (token)"
            value={token}
            onChange={(e) => setToken(e.target.value)}
            style={{ width: "100%", marginBottom: 8 }}
          />
          <button className="save-default-btn" onClick={() => { onSalva(url, token); setMostraForm(false); }}>
            Salva connessione
          </button>
        </div>
      )}
    </div>
  );
}

function PortfolioComposer() {
  const [holdings, setHoldings] = useState([defaultHolding({})]);
  const initialData = useRef(null);
  if (initialData.current === null) initialData.current = loadAppendicesFromStorage();
  const [storico, setStorico] = useState(initialData.current.storico);
  const [storicoGS, setStoricoGS] = useState(initialData.current.storicoGS);
  const [prodottiConfig, setProdottiConfig] = useState(initialData.current.prodotti);
  const [costiPredefiniti, setCostiPredefiniti] = useState(initialData.current.costiPredefiniti);
  const [timeframeYears, setTimeframeYears] = useState(10);
  const [chartMode, setChartMode] = useState("aggregate"); // 'aggregate' | 'detailed'
  const [sintesiModalita, setSintesiModalita] = useState("kid"); // 'kid' | 'cagr' — modalità della tabella Sintesi portafoglio
  // Sezioni incluse in stampa/esportazione PDF, con una spunta per ciascun grafico singolarmente
  // (non un flag unico per "tutti i grafici"). Default: tutto acceso tranne la sintesi, che prima
  // era sempre esclusa dalla stampa senza possibilità di includerla — nessuna sorpresa per chi
  // stampa oggi senza toccare nulla.
  const [sezioniStampa, setSezioniStampa] = useState({ schede: true, composizione: true, allocazione: true, curva: true, sintesi: false });
  const toggleSezioneStampa = (chiave) => setSezioniStampa((prev) => ({ ...prev, [chiave]: !prev[chiave] }));
  const [sezioniStampaMostraForm, setSezioniStampaMostraForm] = useState(false);

  // ---------- Sincronizzazione appendici su Google Sheet ----------
  const [syncConfig, setSyncConfig] = useState(loadSyncConfig());
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | synced | error | offline
  const [syncError, setSyncError] = useState("");
  const [syncMostraForm, setSyncMostraForm] = useState(false);
  const syncTimerRef = useRef(null);
  const syncSkipNextPush = useRef(true); // evita di ri-mandare al foglio i dati appena arrivati da lì

  // Al primo avvio, se una connessione è configurata: confronta la copia locale con quella sul
  // foglio (per data di ultimo salvataggio) e adotta la più recente delle due — riconciliazione
  // semplice "vince l'ultima modifica", adeguata a modifiche occasionali come queste.
  React.useEffect(() => {
    if (!syncConfig.url || !syncConfig.token) return;
    let annullato = false;
    setSyncStatus("syncing");
    fetchAppendiciDaSheet(syncConfig.url, syncConfig.token)
      .then((remoto) => {
        if (annullato) return;
        const localeSalvatoIl = initialData.current && initialData.current._salvatoIl;
        if (remoto && (!localeSalvatoIl || remoto.salvatoIl > localeSalvatoIl)) {
          const nextProdotti = normalizeProdottiList(remoto.appendice_prodotti || []);
          setStorico(normalizeStoricoList(remoto.appendice_rendimenti || []));
          setStoricoGS(normalizeStoricoList(remoto.appendice_rendimenti_gs || []));
          setProdottiConfig(nextProdotti);
          setCostiPredefiniti(normalizeCostiPredefinitiList(remoto.appendice_costi_predefiniti || [], nextProdotti));
        }
        setSyncStatus("synced");
      })
      .catch((err) => {
        if (annullato) return;
        setSyncStatus("error");
        setSyncError(err.message || "Errore di connessione");
      });
    return () => { annullato = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Persistenza automatica unificata: ogni modifica a una delle quattro appendici salva tutte in
  // locale, e — se configurato — le invia al foglio Google dopo una pausa di inattività (le
  // modifiche alle appendici sono occasionali, non serve inviare ad ogni tasto premuto).
  React.useEffect(() => {
    persistAppendicesToStorage(storico, storicoGS, prodottiConfig, costiPredefiniti);

    if (!syncConfig.url || !syncConfig.token) return;
    if (syncSkipNextPush.current) { syncSkipNextPush.current = false; return; }

    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => {
      setSyncStatus("syncing");
      const payload = buildAppendicesPayload(storico, storicoGS, prodottiConfig, costiPredefiniti);
      inviaAppendiciASheet(syncConfig.url, syncConfig.token, payload)
        .then(() => setSyncStatus("synced"))
        .catch((err) => {
          setSyncStatus("error");
          setSyncError(err.message || "Errore di connessione");
        });
    }, 2500);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [storico, storicoGS, prodottiConfig, costiPredefiniti]);

  const handleSalvaConnessione = (url, token) => {
    const next = { url: url.trim(), token: token.trim() };
    setSyncConfig(next);
    saveSyncConfig(next);
    syncSkipNextPush.current = true;
  };

  // Persistenza automatica unificata: ogni modifica a una delle quattro appendici salva tutte.
  React.useEffect(() => {
    persistAppendicesToStorage(storico, storicoGS, prodottiConfig, costiPredefiniti);
  }, [storico, storicoGS, prodottiConfig, costiPredefiniti]);

  // Sincronizzazione automatica scenari: quando nell'Appendice — Configurazione Prodotti vengono
  // modificati i tassi KID (Ottimista/Moderato/Prudente) o gli scostamenti Δ CAGR (pp) di un
  // prodotto — sia sulla Gestione Separata singola sia su ciascun comparto/GS aggiuntiva della
  // lista dinamica — questi valori si aggiornano subito su tutte le schede cliente che referenziano
  // quel prodotto (stesso "nomeKey"), senza toccare le altre impostazioni personalizzate per cliente
  // (importo, date, percentuali, versamenti/prelievi, costi, ecc.).
  React.useEffect(() => {
    setHoldings((prev) => {
      let changed = false;
      const next = prev.map((h) => {
        if (!h.nomeKey || h.nomeKey === CUSTOM_KEY) return h;
        const mapped = prodottiConfig.find((p) => p.nomeProdotto === h.nomeKey);
        if (!mapped) return h;
        let holdingChanged = false;
        const updated = { ...h };
        if (h.gsAssociata) {
          if (
            updated.gsOtt !== mapped.gsOtt || updated.gsMod !== mapped.gsMod || updated.gsPru !== mapped.gsPru ||
            updated.gsDeltaOtt !== mapped.gsDeltaOtt || updated.gsDeltaMod !== mapped.gsDeltaMod || updated.gsDeltaPru !== mapped.gsDeltaPru
          ) {
            updated.gsOtt = mapped.gsOtt;
            updated.gsMod = mapped.gsMod;
            updated.gsPru = mapped.gsPru;
            updated.gsDeltaOtt = mapped.gsDeltaOtt;
            updated.gsDeltaMod = mapped.gsDeltaMod;
            updated.gsDeltaPru = mapped.gsDeltaPru;
            holdingChanged = true;
          }
        }
        if (Array.isArray(h.comparti) && Array.isArray(mapped.comparti) && h.comparti.length && mapped.comparti.length) {
          let compartiChanged = false;
          const nextComparti = h.comparti.map((c, idx) => {
            const tpl = mapped.comparti[idx];
            if (!tpl) return c;
            if (
              c.ott !== tpl.ott || c.mod !== tpl.mod || c.pru !== tpl.pru ||
              c.deltaOtt !== tpl.deltaOtt || c.deltaMod !== tpl.deltaMod || c.deltaPru !== tpl.deltaPru
            ) {
              compartiChanged = true;
              return { ...c, ott: tpl.ott, mod: tpl.mod, pru: tpl.pru, deltaOtt: tpl.deltaOtt, deltaMod: tpl.deltaMod, deltaPru: tpl.deltaPru };
            }
            return c;
          });
          if (compartiChanged) {
            updated.comparti = nextComparti;
            holdingChanged = true;
          }
        }
        if (holdingChanged) {
          changed = true;
          return updated;
        }
        return h;
      });
      return changed ? next : prev;
    });
  }, [prodottiConfig]);

  const appendiciFileRef = useRef(null);
  const progettoFileRef = useRef(null);
  const [importMsg, setImportMsg] = useState(null);

  const downloadJson = (payload, filename) => {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // FLUSSO A — Appendici (database storico): non tocca le schede prodotto a schermo.
  const handleExportAppendici = () => {
    const payload = buildAppendicesPayload(storico, storicoGS, prodottiConfig, costiPredefiniti);
    downloadJson(payload, `database_appendici-${new Date().toISOString().slice(0, 10)}.json`);
  };
  const handleImportAppendiciClick = () => appendiciFileRef.current && appendiciFileRef.current.click();
  const handleImportAppendiciFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        const storicoList = Array.isArray(parsed.appendice_rendimenti) ? parsed.appendice_rendimenti : (Array.isArray(parsed) ? parsed : parsed.comparti);
        const storicoGSList = Array.isArray(parsed.appendice_rendimenti_gs) ? parsed.appendice_rendimenti_gs : [];
        const prodottiList = Array.isArray(parsed.appendice_prodotti) ? parsed.appendice_prodotti : [];
        const costiList = Array.isArray(parsed.appendice_costi_predefiniti) ? parsed.appendice_costi_predefiniti : [];
        if (!Array.isArray(storicoList) && !Array.isArray(prodottiList)) throw new Error("formato non riconosciuto");
        const nextStorico = normalizeStoricoList(storicoList || []);
        const nextStoricoGS = normalizeStoricoList(storicoGSList || []);
        const nextProdotti = normalizeProdottiList(prodottiList || []);
        const nextCosti = normalizeCostiPredefinitiList(costiList || [], nextProdotti);
        setStorico(nextStorico);
        setStoricoGS(nextStoricoGS);
        setProdottiConfig(nextProdotti);
        setCostiPredefiniti(nextCosti);
        setImportMsg({ type: "ok", text: `Appendici importate: ${nextStorico.length} comparti Multiramo, ${nextStoricoGS.length} Gestioni Separate, ${nextProdotti.length} configurazioni prodotto, ${nextCosti.length} profili di costo predefiniti. Le schede prodotto a schermo non sono state modificate.` });
      } catch (err) {
        setImportMsg({ type: "error", text: "File Appendici non valido: deve essere un JSON esportato da questo strumento (database_appendici)." });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // FLUSSO B — Progetto (sessione di lavoro): non tocca le appendici salvate nel browser.
  const handleExportProgetto = () => {
    const payload = {
      version: 1,
      salvatoIl: new Date().toISOString(),
      prodotti_configurati_utente: holdings.map(serializeHolding),
    };
    downloadJson(payload, `progetto_cliente-${new Date().toISOString().slice(0, 10)}.json`);
  };
  const handleImportProgettoClick = () => progettoFileRef.current && progettoFileRef.current.click();
  const handleImportProgettoFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        const holdingsList = Array.isArray(parsed.prodotti_configurati_utente) ? parsed.prodotti_configurati_utente : (Array.isArray(parsed) ? parsed : null);
        if (!Array.isArray(holdingsList)) throw new Error("formato non riconosciuto");
        const nextHoldings = normalizeHoldingsList(holdingsList);
        setHoldings(nextHoldings);
        setImportMsg({ type: "ok", text: `Progetto importato: ${nextHoldings.length} schede prodotto. Le appendici salvate nel browser non sono state modificate.` });
      } catch (err) {
        setImportMsg({ type: "error", text: "File Progetto non valido: deve essere un JSON esportato da questo strumento (progetto_cliente)." });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const updateHolding = (id, next) => setHoldings((prev) => prev.map((h) => (h.id === id ? next : h)));
  const removeHolding = (id) => setHoldings((prev) => prev.filter((h) => h.id !== id));
  const addHolding = () => setHoldings((prev) => [...prev, defaultHolding({})]);

  // L'orizzonte del grafico si estende oltre la durata contrattuale più lunga (proiezione
  // continuativa, utile per polizze vita intera/IBIP): la linea di scadenza resta visibile come
  // riferimento, non come limite del disegno.
  const maxAnni = Math.ceil(Math.max(1, ...holdings.map((h) => h.anni)) * 1.3);

  const allRows = useMemo(
    () =>
      holdings.map((h, i) => {
        const isConfigured = h.nomeKey !== "";
        const gross = isConfigured ? summarizeGross(h, storico, storicoGS, timeframeYears, sintesiModalita) : { capitaleIniziale: 0, capitaleFinale: 0, rendimentoPct: 0 };
        const net = isConfigured ? summarizeNet(h, storico, storicoGS, timeframeYears, sintesiModalita) : null;
        const final = isConfigured ? displayFinal(h, storico, storicoGS, timeframeYears, sintesiModalita) : { value: 0, isNet: false };
        const scenari = isConfigured
          ? {
              ottimista: scenarioFinalValue(h, storico, storicoGS, "ottimista", timeframeYears, sintesiModalita),
              potenziale: scenarioFinalValue(h, storico, storicoGS, "potenziale", timeframeYears, sintesiModalita),
              prudente: scenarioFinalValue(h, storico, storicoGS, "prudente", timeframeYears, sintesiModalita),
            }
          : {
              ottimista: { value: 0, isNet: false, rendPct: 0 },
              potenziale: { value: 0, isNet: false, rendPct: 0 },
              prudente: { value: 0, isNet: false, rendPct: 0 },
            };
        const label = h.nomeKey === CUSTOM_KEY ? (h.nomeCustom.trim() || slotLabel(i)) : (h.nomeKey || slotLabel(i));
        return { holding: h, idx: i, color: colorFor(i), label, gross, net, final, scenari, isConfigured };
      }),
    [holdings, storico, storicoGS, timeframeYears, sintesiModalita]
  );

  // Le schede senza prodotto selezionato, o esplicitamente escluse dal portafoglio, restano fuori
  // da grafici, torta e tabella di sintesi (rimangono comunque configurate e visibili a schermo).
  const rows = useMemo(() => allRows.filter((r) => r.isConfigured && r.holding.inclusoInPortafoglio), [allRows]);

  const totalScenari = {
    ottimista: rows.reduce((s, r) => s + r.scenari.ottimista.value, 0),
    potenziale: rows.reduce((s, r) => s + r.scenari.potenziale.value, 0),
    prudente: rows.reduce((s, r) => s + r.scenari.prudente.value, 0),
  };

  const totalIniziale = rows.reduce((s, r) => s + r.gross.capitaleIniziale, 0);
  const macroAllocazione = useMemo(
    () => calcolaMacroAllocazione(rows, storico, storicoGS, timeframeYears),
    [rows, storico, storicoGS, timeframeYears]
  );
  const dettaglioComponenti = useMemo(
    () => calcolaDettaglioComponenti(rows, storico, storicoGS, timeframeYears),
    [rows, storico, storicoGS, timeframeYears]
  );

  const growthSeries = useMemo(
    () => rows.map((r) => buildGrowth(r.holding, storico, storicoGS, maxAnni, undefined, timeframeYears)),
    [rows, storico, storicoGS, maxAnni, timeframeYears]
  );

  // Asse a date reali condiviso, usato solo dal grafico "Portafoglio Complessivo": ogni prodotto
  // capitalizza dalla propria data di investimento, allineato su un'unica timeline calendariale.
  const timelineAssoluta = useMemo(
    () => buildTimelineAssoluta(rows.map((r) => r.holding)),
    [rows]
  );
  const aggregateSeries = useMemo(
    () => buildAggregatePortfolioSeries(rows.map((r) => r.holding), storico, storicoGS, timeframeYears),
    [rows, storico, storicoGS, timeframeYears]
  );

  const [printDate, setPrintDate] = useState(null);
  const handlePrint = () => {
    setPrintDate(new Date());
    setTimeout(() => window.print(), 60);
  };
  const formattedPrintDate = printDate
    ? printDate.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " alle " +
      printDate.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })
    : null;

  return (
    <div className="app-root">
      <div className="top-bar-banner no-print"></div>
      <div className="top-bar no-print">
        <div>
          <h1>Compositore di Portafoglio</h1>
          <p>Costruzione e confronto consulenziale di più prodotti in un unico portafoglio</p>
        </div>
      </div>
      <div className="print-flow">
        <div className={sezioniStampa.schede ? "holdings-grid" : "holdings-grid no-print"}>
          {holdings.map((h, i) => (
            <HoldingCard
              key={h.id}
              holding={h}
              idx={i}
              storico={storico}
              storicoGS={storicoGS}
              prodottiConfig={prodottiConfig}
              costiPredefiniti={costiPredefiniti}
              setCostiPredefiniti={setCostiPredefiniti}
              timeframeYears={timeframeYears}
              onUpdate={updateHolding}
              onRemove={removeHolding}
              canRemove={holdings.length > 1}
            />
          ))}
        </div>

        <button className="add-product-btn no-print" onClick={addHolding}>+ Aggiungi prodotto al portafoglio</button>

        <div className="section">
          <div className="allocation-cards-grid">
            <div className={sezioniStampa.composizione ? "chart-card pie-chart-card alloc-card" : "chart-card pie-chart-card alloc-card no-print"}>
              <h3>Composizione del portafoglio</h3>
              <div className="alloc-card-body">
                <PieChart slices={rows.map((r) => ({ label: r.label, importo: r.gross.capitaleIniziale, color: r.color }))} />
              </div>
            </div>
            <div className={sezioniStampa.allocazione ? "chart-card pie-chart-card alloc-card" : "chart-card pie-chart-card alloc-card no-print"}>
              <h3>Dettaglio Allocazione</h3>
              <div className="alloc-card-body">
                {dettaglioComponenti.length > 0 ? (
                  <>
                    <AllocazioneUnificataDonut
                      items={dettaglioComponenti}
                      totaleGS={macroAllocazione.totaleGS}
                      totaleMR={macroAllocazione.totaleMR}
                    />
                    <div className="allocazione-legend-2col">
                      <div className="alloc-legend-col">
                        <div className="alloc-legend-head" style={{ color: "#2C699A" }}>
                          Gestione Separata
                        </div>
                        {dettaglioComponenti.filter((c) => c.tipo === "gs").length > 0 ? (
                          dettaglioComponenti.filter((c) => c.tipo === "gs").map((c) => (
                            <div key={`gs-${c.label}`} className="alloc-legend-row">
                              <span className="swatch" style={{ background: c.color }}></span>
                              <span className="alloc-legend-nome">{c.label}</span>
                              <span>— {(macroAllocazione.totaleGS + macroAllocazione.totaleMR) > 0 ? ((c.importo / (macroAllocazione.totaleGS + macroAllocazione.totaleMR)) * 100).toFixed(1) : "0.0"}%</span>
                            </div>
                          ))
                        ) : (
                          <p className="alloc-legend-empty">Nessun comparto GS attivo.</p>
                        )}
                      </div>
                      <div className="alloc-legend-col">
                        <div className="alloc-legend-head" style={{ color: "#16DB93" }}>
                          Multi Ramo
                        </div>
                        {dettaglioComponenti.filter((c) => c.tipo === "mr").length > 0 ? (
                          dettaglioComponenti.filter((c) => c.tipo === "mr").map((c) => (
                            <div key={`mr-${c.label}`} className="alloc-legend-row">
                              <span className="swatch" style={{ background: c.color }}></span>
                              <span className="alloc-legend-nome">{c.label}</span>
                              <span>— {(macroAllocazione.totaleGS + macroAllocazione.totaleMR) > 0 ? ((c.importo / (macroAllocazione.totaleGS + macroAllocazione.totaleMR)) * 100).toFixed(1) : "0.0"}%</span>
                            </div>
                          ))
                        ) : (
                          <p className="alloc-legend-empty">Nessun comparto MR attivo.</p>
                        )}
                      </div>
                    </div>
                  </>
                ) : (
                  <p className="empty-note">Nessun comparto attivo.</p>
                )}
              </div>
            </div>
          </div>
          <div className={sezioniStampa.curva ? "chart-card growth-chart-card" : "chart-card growth-chart-card no-print"} style={{ marginTop: 16 }}>
            <div className="chart-card-head">
              <h3>Curva di crescita del capitale nel tempo</h3>
              <div className="mini-seg no-print">
                <button type="button" className={chartMode === "aggregate" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => setChartMode("aggregate")}>Portafoglio Complessivo</button>
                <button type="button" className={chartMode === "detailed" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => setChartMode("detailed")}>Dettaglio Prodotti</button>
              </div>
            </div>
            {chartMode === "aggregate" ? (
              aggregateSeries.length > 0 ? (
                <GrowthChartAssoluto
                  points={aggregateSeries}
                  label="Totale Portafoglio"
                  color="#1F3A5F"
                  scadenze={rows.map((r) => ({ label: r.label, dataYMD: addAnniISO(r.holding.dataInvestimento, r.holding.anni) }))}
                />
              ) : (
                <p className="empty-note">Nessun prodotto incluso nel portafoglio.</p>
              )
            ) : (
              <GrowthChart
                series={growthSeries}
                maxYear={maxAnni}
                labels={rows.map((r) => r.label)}
                colors={rows.map((r) => r.color)}
                scadenzeAnni={rows.map((r) => r.holding.anni)}
                puntiReali={rows.map((r) => {
                  const consuntivo = calcolaConsuntivoReale(r.holding, storico, storicoGS, timeframeYears);
                  return consuntivo ? { x: consuntivo.anniTrascorsi, y: consuntivo.valoreLordoReale } : null;
                })}
              />
            )}
          </div>
        </div>
      </div>

      <div className={sezioniStampa.sintesi ? "table-card" : "table-card no-print"}>
        <div className="chart-card-head">
          <h3>Sintesi portafoglio</h3>
          <div className="mini-seg no-print">
            <button type="button" className={sintesiModalita === "kid" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => setSintesiModalita("kid")} title="Tassi KID assoluti definiti per scenario">Scenari KID</button>
            <button type="button" className={sintesiModalita === "cagr" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => setSintesiModalita("cagr")} title="CAGR storico/manuale di base + scostamento in punti percentuali per scenario">Scenari Δ CAGR</button>
          </div>
        </div>
        <table className="summary">
          <thead>
            <tr>
              <th>Prodotto</th>
              <th>Orizzonte</th>
              <th>Capitale iniziale</th>
              <th>Finale — Prudente</th>
              <th>Finale — Potenziale</th>
              <th>Finale — Ottimista</th>
              <th>Rendimento (Potenziale)</th>
              <th>Prelievi Netti Ricevuti</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const prelieviNetti = r.net ? r.net.prelieviNettiCumulati : r.gross.prelieviNettiCumulati;
              return (
              <tr key={r.holding.id}>
                <td><span className="swatch" style={{ background: r.color }}></span>{r.label}</td>
                <td>{r.holding.anni} anni</td>
                <td><AnimatedEur value={r.gross.capitaleIniziale} /></td>
                <td><AnimatedEur value={r.scenari.prudente.value} />{r.scenari.prudente.isNet && <span className="net-tag">netto</span>}</td>
                <td><AnimatedEur value={r.scenari.potenziale.value} />{r.scenari.potenziale.isNet && <span className="net-tag">netto</span>}</td>
                <td><AnimatedEur value={r.scenari.ottimista.value} />{r.scenari.ottimista.isNet && <span className="net-tag">netto</span>}</td>
                <td>{pct(r.scenari.potenziale.rendPct)}</td>
                <td>{prelieviNetti > 0 ? <AnimatedEur value={prelieviNetti} /> : "—"}</td>
              </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr>
              <td>Totale portafoglio</td>
              <td>—</td>
              <td><AnimatedEur value={totalIniziale} /></td>
              <td><AnimatedEur value={totalScenari.prudente} /></td>
              <td><AnimatedEur value={totalScenari.potenziale} /></td>
              <td><AnimatedEur value={totalScenari.ottimista} /></td>
              <td>{pct(totalIniziale > 0 ? ((totalScenari.potenziale - totalIniziale) / totalIniziale) * 100 : 0)}</td>
              <td><AnimatedEur value={rows.reduce((s, r) => s + (r.net ? r.net.prelieviNettiCumulati : r.gross.prelieviNettiCumulati), 0)} /></td>
            </tr>
          </tfoot>
        </table>
      </div>

      {formattedPrintDate && (
        <p className="print-only-date">Documento generato il {formattedPrintDate}</p>
      )}

      <div className="sezioni-stampa-box no-print">
        <div className="sezioni-stampa-head">
          <span className="sezioni-stampa-titolo">Sezioni incluse in stampa/PDF</span>
          <button className="sync-toggle-btn" onClick={() => setSezioniStampaMostraForm(!sezioniStampaMostraForm)}>
            {sezioniStampaMostraForm ? "Chiudi" : "Sezioni stampa/PDF"}
          </button>
        </div>
        {sezioniStampaMostraForm && (
          <div className="sezioni-stampa-form">
            <label className="sezioni-stampa-check">
              <input type="checkbox" checked={sezioniStampa.schede} onChange={() => toggleSezioneStampa("schede")} />
              Schede prodotto
            </label>
            <label className="sezioni-stampa-check">
              <input type="checkbox" checked={sezioniStampa.composizione} onChange={() => toggleSezioneStampa("composizione")} />
              Composizione del portafoglio
            </label>
            <label className="sezioni-stampa-check">
              <input type="checkbox" checked={sezioniStampa.allocazione} onChange={() => toggleSezioneStampa("allocazione")} />
              Dettaglio Allocazione
            </label>
            <label className="sezioni-stampa-check">
              <input type="checkbox" checked={sezioniStampa.curva} onChange={() => toggleSezioneStampa("curva")} />
              Curva di crescita del capitale
            </label>
            <label className="sezioni-stampa-check">
              <input type="checkbox" checked={sezioniStampa.sintesi} onChange={() => toggleSezioneStampa("sintesi")} />
              Tabella di sintesi portafoglio
            </label>
          </div>
        )}
      </div>

      <SyncBox
        syncConfig={syncConfig}
        syncStatus={syncStatus}
        syncError={syncError}
        mostraForm={syncMostraForm}
        setMostraForm={setSyncMostraForm}
        onSalva={handleSalvaConnessione}
      />

      <div className="print-export-row no-print">
        <button className="print-btn" onClick={handlePrint}>Esporta / Stampa PDF</button>
        {formattedPrintDate && <div className="print-date-note">Ultima esportazione: {formattedPrintDate}</div>}
      </div>

      <div className="io-toolbar no-print">
        <div className="io-group">
          <span className="io-group-label">Database Appendici</span>
          <button className="io-btn" onClick={handleExportAppendici}>Esporta Appendici</button>
          <button className="io-btn" onClick={handleImportAppendiciClick}>Importa Appendici</button>
          <input ref={appendiciFileRef} type="file" accept=".json" style={{ display: "none" }} onChange={handleImportAppendiciFile} />
        </div>
        <div className="io-group">
          <span className="io-group-label">Progetto (sessione)</span>
          <button className="io-btn" onClick={handleExportProgetto}>Esporta Progetto</button>
          <button className="io-btn" onClick={handleImportProgettoClick}>Importa Progetto</button>
          <input ref={progettoFileRef} type="file" accept=".json" style={{ display: "none" }} onChange={handleImportProgettoFile} />
        </div>
      </div>
      {importMsg && <p className={(importMsg.type === "error" ? "import-msg error" : "import-msg ok") + " no-print"}>{importMsg.text}</p>}

      <AppendixStorico
        rows={storico}
        setRows={setStorico}
        timeframeYears={timeframeYears}
        onTimeframeChange={setTimeframeYears}
        showTimeframeSelector={false}
        perRowTimeframe={true}
        title="Appendice — Rendimenti storici di riferimento (comparti Multiramo)"
        hint="Inserisci la serie dei rendimenti annui di ciascun comparto Multiramo (minimo 10 anni, estendibile fino a 20+). Ogni comparto ha il proprio selettore di orizzonte CAGR (5/10/15/20 anni), indipendente dagli altri comparti. Il CAGR si calcola con il prodotto geometrico dei rendimenti sugli N anni più recenti scelti riga per riga, e diventa selezionabile come fonte del tasso Multiramo di base in ogni prodotto."
        addLabel="+ Aggiungi comparto storico"
        emptyLabel="Nessun comparto storico inserito."
      />
      <AppendixStorico
        rows={storicoGS}
        setRows={setStoricoGS}
        timeframeYears={timeframeYears}
        onTimeframeChange={setTimeframeYears}
        showTimeframeSelector={false}
        perRowTimeframe={true}
        title="Appendice — Rendimenti storici di riferimento (Gestioni Separate)"
        hint="Inserisci la serie dei rendimenti annui lordi di ciascuna Gestione Separata (fino a 20 anni). Ogni Gestione Separata ha il proprio selettore di orizzonte CAGR (5/10/15/20 anni), indipendente dal timeframe usato per i comparti Multiramo sopra. Il CAGR si calcola con la stessa formula (montante geometrico) sugli N anni più recenti scelti riga per riga. Diventa selezionabile come fonte del tasso Gestione Separata di base in ogni prodotto."
        addLabel="+ Aggiungi Gestione Separata storica"
        emptyLabel="Nessuna Gestione Separata storica inserita."
      />
      <AppendixProdotti rows={prodottiConfig} setRows={setProdottiConfig} storico={storico} storicoGS={storicoGS} />
      <AppendixCostiPredefiniti rows={costiPredefiniti} setRows={setCostiPredefiniti} prodottiConfig={prodottiConfig} />

      <p className="disclaimer">
        Simulazione a scopo illustrativo e consulenziale, basata su capitalizzazione composta deterministica. La
        "Curva di crescita del capitale" usa il tasso di base di ciascuna componente (storico da appendice, secondo
        la regola CAGR = [ Π (1 + Rₜ) ]^(1/X) − 1 sugli ultimi X anni selezionati, o manuale), proiettato come
        ValoreFinale = CapitaleIniziale × (1+tasso)^AnniProiezione. La "Sintesi portafoglio" (Ottimista/Potenziale/
        Prudente) usa invece i tassi KID assoluti configurati per prodotto in Appendice — Configurazione Prodotti,
        applicati indipendentemente alla quota Gestione Separata e alla quota Comparto Multiramo prima di sommare i
        due risultati: i rendimenti passati non garantiscono rendimenti futuri e i tassi KID non derivano
        automaticamente dallo storico. La composizione predefinita di ciascun prodotto è una mappatura che imposti
        tu; il range massimo/minimo ammesso per prodotto resta un parametro di codice (PRODUCT_CATALOG) da
        confermare con le condizioni contrattuali reali. Il livello "Costi e fiscalità" applica il rispettivo costo
        di gestione annua alla quota di capitale della propria componente (GS o Comparto) prima dell'aggregazione,
        identicamente sopra ciascuno dei tre scenari; è una semplificazione e non sostituisce il KID/DIP del
        prodotto reale. Tutte e tre le appendici vengono salvate solo nel browser in uso (LocalStorage, nessun
        server): cancellare i dati di navigazione le elimina. Usa "Esporta Appendici" per conservarle o trasferirle
        su un altro dispositivo/browser.
      </p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PortfolioComposer />);
</script>
