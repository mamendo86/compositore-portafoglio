// Legge le appendici dal foglio Google collegato. Ritorna il payload salvato lì, o null se il
// foglio non ha ancora nulla salvato. Lancia un'eccezione se la connessione/il token non vanno.
async function fetchAppendiciDaSheet(url, token) {
  const resp = await fetch(`${url}?token=${encodeURIComponent(token)}`, { method: "GET" });
  if (!resp.ok) throw new Error(`Risposta HTTP ${resp.status}`);
  const json = await resp.json();
  if (json.errore) throw new Error(json.errore);
  return json.dati || null;
}

// Scrive le appendici sul foglio Google collegato. Content-Type "text/plain" deliberato: gli Apps
// Script Web App non gestiscono la richiesta preflight OPTIONS che il browser manderebbe con
// "application/json", quindi la fetch fallirebbe per CORS. Il corpo resta comunque JSON valido —
// è la funzione doPost() lato script a fare JSON.parse(e.postData.contents), non l'header a deciderlo.
async function inviaAppendiciASheet(url, token, payload) {
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token, dati: payload }),
  });
  if (!resp.ok) throw new Error(`Risposta HTTP ${resp.status}`);
  const json = await resp.json();
  if (json.errore) throw new Error(json.errore);
  return true;
}

function serializeHolding(h) {
  const { id, ...rest } = h;
  return rest;
}

function normalizeHoldingsList(list) {
  if (!Array.isArray(list) || list.length === 0) return [defaultHolding({})];
  return list.map((h) => defaultHolding(migrateHolding(h)));
}

// holdings è opzionale: l'autosalvataggio in LocalStorage copre le quattro appendici;
// l'export manuale ("Esporta Configurazione") include anche le schede prodotto correnti,
// per poter riprendere la sessione esattamente da dove era stata interrotta.
function buildAppendicesPayload(storico, storicoGS, prodotti, costiPredefiniti, holdings) {
  const payload = {
    version: 4,
    salvatoIl: new Date().toISOString(),
    appendice_rendimenti: storico.map((r) => ({ id: r.id, nome: r.nome, rendimenti: r.rendimenti, orizzonteCagr: r.orizzonteCagr, annoPiuRecente: r.annoPiuRecente })),
    appendice_rendimenti_gs: storicoGS.map((r) => ({ id: r.id, nome: r.nome, rendimenti: r.rendimenti, orizzonteCagr: r.orizzonteCagr, annoPiuRecente: r.annoPiuRecente })),
    appendice_prodotti: prodotti.map((p) => ({
      id: p.id,
      nomeProdotto: p.nomeProdotto,
      permetteVersamenti: p.permetteVersamenti,
      permettePrelievi: p.permettePrelievi,
      gsAssociata: p.gsAssociata,
      gsPct: p.gsPct,
      nomeFondoGS: p.nomeFondoGS,
      gsOtt: p.gsOtt,
      gsMod: p.gsMod,
      gsPru: p.gsPru,
      gsDeltaOtt: p.gsDeltaOtt,
      gsDeltaMod: p.gsDeltaMod,
      gsDeltaPru: p.gsDeltaPru,
      comparti: p.comparti.map((c) => ({
        nomeComparto: c.nomeComparto,
        tipo: c.tipo,
        pct: c.pct,
        anniCagr: c.anniCagr,
        ott: c.ott,
        mod: c.mod,
        pru: c.pru,
        deltaOtt: c.deltaOtt,
        deltaMod: c.deltaMod,
        deltaPru: c.deltaPru,
      })),
    })),
    appendice_costi_predefiniti: (costiPredefiniti || []).map((c) => {
      // nomeProdotto salvato come backup di lettura: se in futuro un id dovesse comunque
      // non trovare corrispondenza, normalizeCostiPredefinitiList può ricollegare il profilo
      // di costo al prodotto giusto cercandolo per nome invece di lasciarlo orfano.
      const prodottoAssociato = prodotti.find((p) => p.id === c.prodottoId);
      return {
        prodottoId: c.prodottoId,
        nomeProdotto: prodottoAssociato ? prodottoAssociato.nomeProdotto : "",
        caricamentoTipo: c.caricamentoTipo,
        caricamentoPct: c.caricamentoPct,
        caricamentoUnitario: c.caricamentoUnitario,
        riscattoSchedule: c.riscattoSchedule,
        performanceFee: c.performanceFee,
        aliquota: c.aliquota,
        tipoImponibile: c.tipoImponibile,
        prodottoAssicurativo: c.prodottoAssicurativo,
        gestioneComponenti: c.gestioneComponenti,
      };
    }),
  };
  if (holdings) {
    payload.prodotti_configurati_utente = holdings.map(serializeHolding);
  }
  return payload;
}

// ---------- calculation core ----------

// CAGR da una serie di rendimenti annui (prodotto geometrico), limitato agli ultimi X anni
// (timeframe) rispetto all'anno più recente disponibile. Se la serie è più corta di X, usa
// tutti gli anni disponibili. CAGR = [ Π (1+Rt) ]^(1/X) - 1, con Rt in decimale.
// CAGR ancorato a un anno solare: se annoPiuRecente e annoFineFinestra sono forniti, seleziona
// esattamente gli anni solari [annoFineFinestra - timeframeYears + 1, annoFineFinestra] (calcolando
// l'anno implicito di ciascuna voce a ritroso da annoPiuRecente, che è l'anno dell'ultima voce della
// serie), invece dei semplici "ultimi N valori dell'array". Senza questi due parametri, ricade sul
// comportamento precedente (ultimi N valori, nessun ancoraggio calendariale) — usato solo come rete
// di sicurezza se una riga storica non ha ancora un anno di riferimento impostato.
function cagrFromReturns(rendimenti, timeframeYears, annoPiuRecente, annoFineFinestra) {
  const n = rendimenti.length;
  if (n === 0) return 0;
  if (annoPiuRecente !== undefined && annoPiuRecente !== null && annoFineFinestra !== undefined) {
    const annoInizioFinestra = annoFineFinestra - timeframeYears + 1;
    const selezionati = rendimenti.filter((_, i) => {
      const anno = annoPiuRecente - (n - 1 - i);
      return anno >= annoInizioFinestra && anno <= annoFineFinestra;
    });
    if (selezionati.length === 0) return 0;
    const prodotto = selezionati.reduce((acc, r) => acc * (1 + r / 100), 1);
    if (prodotto <= 0) return -100;
    return (Math.pow(prodotto, 1 / selezionati.length) - 1) * 100;
  }
  const X = timeframeYears ? Math.min(timeframeYears, n) : n;
  const slice = rendimenti.slice(-X);
  const prodotto = slice.reduce((acc, r) => acc * (1 + r / 100), 1);
  if (prodotto <= 0) return -100;
  return (Math.pow(prodotto, 1 / X) - 1) * 100;
}

// Anni effettivamente usati nel calcolo (per trasparenza in UI, quando la serie è più corta della
// finestra richiesta, ancorata o meno).
function effectiveYearsUsed(rendimenti, timeframeYears, annoPiuRecente, annoFineFinestra) {
  const n = rendimenti.length;
  if (annoPiuRecente !== undefined && annoPiuRecente !== null && annoFineFinestra !== undefined) {
    const annoInizioFinestra = annoFineFinestra - timeframeYears + 1;
    return rendimenti.filter((_, i) => {
      const anno = annoPiuRecente - (n - 1 - i);
      return anno >= annoInizioFinestra && anno <= annoFineFinestra;
    }).length;
  }
  return timeframeYears ? Math.min(timeframeYears, n) : n;
}

// Anno solare implicito della voce all'indice i di una serie storica (voci ordinate dalla più
// vecchia alla più recente), dato l'anno solare dell'ultima voce (annoPiuRecente).
function annoImplicito(rendimenti, annoPiuRecente, i) {
  return annoPiuRecente - (rendimenti.length - 1 - i);
}
// Ultimo anno solare "consolidato" utilizzabile come fine finestra CAGR per un dato T0 di
// investimento: l'anno immediatamente precedente a quello della data di investimento.
function annoFineFinestraDaData(dataYMD) {
  return parseYMD(dataYMD).y - 1;
}
// Stesso concetto ma per l'anteprima CAGR nell'appendice (nessun prodotto/T0 specifico coinvolto):
// ancorato all'anno solare corrente.
function annoFineFinestraOggi() {
  return new Date().getFullYear() - 1;
}

// (Nota: il tasso per ciascun comparto Multiramo è ora risolto per-comparto dentro
// getHoldingComponents, poiché ogni comparto ha una propria fonte storica/manuale indipendente.)

// Tasso "storico di base" per la quota Gestione Separata: manuale oppure CAGR della GS selezionata
// nell'Appendice — Rendimenti storici (Gestioni Separate), ancorato all'anno solare precedente alla
// data di investimento del prodotto (non ai valori più recenti in assoluto della serie).
function resolveRateGS(holding, storicoGS, timeframeYears) {
  if (!holding.gsFonte || holding.gsFonte === "manuale") return holding.rateGSManuale;
  const row = (storicoGS || []).find((r) => r.id === holding.gsFonte);
  if (!row) return holding.rateGSManuale;
  const annoFineFinestra = annoFineFinestraDaData(holding.dataInvestimento);
  return cagrFromReturns(row.rendimenti, row.orizzonteCagr || timeframeYears, row.annoPiuRecente, annoFineFinestra);
}

// I tre scenari KID (Ottimista/Potenziale-Moderato/Prudente) sono ora tassi assoluti indipendenti
// per ciascuna componente (Gestione Separata e Comparto Multiramo), definiti per prodotto
// nell'Appendice — Configurazione Prodotti. Non derivano più dal CAGR storico + scostamento:
// il CAGR storico/manuale resta la base solo per la curva di crescita deterministica del prodotto.
// Se il prodotto non ha una configurazione in Appendice, si usano i default sotto.
const SCENARIOS = ["ottimista", "potenziale", "prudente"];
const SCENARIO_LABELS = { ottimista: "Ottimista", potenziale: "Potenziale (Moderato)", prudente: "Prudente" };
const DEFAULT_SCENARI_GS = { ottimista: 2, potenziale: 1.5, prudente: 0.5 };
const DEFAULT_SCENARI_MR = { ottimista: 5, potenziale: 2, prudente: -1 };
const SCENARIO_KEY_TO_FIELD = { ottimista: "ott", potenziale: "mod", prudente: "pru" };

// Elenca le componenti finanziarie attive di una scheda prodotto: la Gestione Separata (se
// associata) più ciascun comparto Multiramo della lista dinamica. Centralizza la lettura dei tassi
// (base storico/manuale + i 3 tassi KID + costo di gestione annua) così che growth curve, scenari
// lordi e netti iterino tutti sulla stessa struttura, indipendentemente da quante componenti ci sono.
function getHoldingComponents(holding, storico, storicoGS, timeframeYears) {
  const list = [];
  if (holding.gsAssociata) {
    const gsSourceRow = holding.gsFonte && holding.gsFonte !== "manuale" ? (storicoGS || []).find((r) => r.id === holding.gsFonte) : null;
    const rateBaseGS = resolveRateGS(holding, storicoGS, timeframeYears);
    list.push({
      key: "gs",
      tipo: "gs",
      label: gsSourceRow ? gsSourceRow.nome : "Gestione Separata",
      pct: holding.gsPct || 0,
      rateBase: rateBaseGS,
      scenari: { ottimista: holding.gsOtt, potenziale: holding.gsMod, prudente: holding.gsPru },
      scenariCagr: {
        ottimista: rateBaseGS + (holding.gsDeltaOtt || 0),
        potenziale: rateBaseGS + (holding.gsDeltaMod || 0),
        prudente: rateBaseGS + (holding.gsDeltaPru || 0),
      },
      costoAnnuo: (holding.costiGestioneComponenti && holding.costiGestioneComponenti.gs) || 0,
    });
  }
  (holding.comparti || []).forEach((c) => {
    // c.tipo distingue una GS "aggiuntiva" (oltre allo slot GS singolo qui sopra) da un comparto
    // Multiramo: la fonte storica si cerca nell'archivio corretto in base al tipo. Permette prodotti
    // come "Rinnova VALORE BONUS" con due Gestioni Separate (es. GESAV + Ri.Alto) invece di GS+Multiramo.
    const isGS = c.tipo === "gs";
    const fonteList = isGS ? (storicoGS || []) : storico;
    const fonteRow = c.multiramoFonte && c.multiramoFonte !== "manuale" ? fonteList.find((r) => r.id === c.multiramoFonte) : null;
    const rateBase = fonteRow
      ? cagrFromReturns(fonteRow.rendimenti, clampTimeframe(fonteRow.orizzonteCagr) || timeframeYears, fonteRow.annoPiuRecente, annoFineFinestraDaData(holding.dataInvestimento))
      : c.rateMRManuale;
    list.push({
      key: c.id,
      tipo: isGS ? "gs" : "mr",
      label: c.nomeComparto || (isGS ? "Gestione Separata" : "Comparto"),
      pct: c.pct || 0,
      rateBase,
      scenari: { ottimista: c.ott, potenziale: c.mod, prudente: c.pru },
      scenariCagr: {
        ottimista: rateBase + (c.deltaOtt || 0),
        potenziale: rateBase + (c.deltaMod || 0),
        prudente: rateBase + (c.deltaPru || 0),
      },
      costoAnnuo: (holding.costiGestioneComponenti && holding.costiGestioneComponenti[c.id]) || 0,
    });
  });
  return list;
}

function totalPctHolding(holding) {
  return (holding.gsAssociata ? Number(holding.gsPct) || 0 : 0) + (holding.comparti || []).reduce((s, c) => s + (Number(c.pct) || 0), 0);
}

// ---------- Motore a date reali (normalizzate a fine mese, frazione d'anno in dodicesimi) ----------
// Tutte le date sono trattate come coppie intere [anno, mese] — mai come oggetti Date con calcoli in
// millisecondi/giorni — per eliminare a monte qualunque bug di overflow legato a mesi di lunghezza
// diversa, anni bisestili o fusi orari. Il confronto cronologico usa il confronto lessicografico di
// stringhe "YYYY-MM-DD" (valido perché sempre zero-padded a lunghezza fissa).
function parseYMD(dataYMD) {
  const [y, m, d] = dataYMD.split("-").map(Number);
  return { y, m, d }; // m: 1-12
}
function giorniNelMese(y, m) {
  return new Date(y, m, 0).getDate(); // ultimo giorno del mese m (1-12) dell'anno y
}
// Normalizza qualunque data al suo fine mese, es. 2026-05-14 → 2026-05-31.
function normalizeDataFineMese(dataYMD) {
  if (!dataYMD) return dataYMD;
  const { y, m } = parseYMD(dataYMD);
  const gg = giorniNelMese(y, m);
  return `${y}-${String(m).padStart(2, "0")}-${String(gg).padStart(2, "0")}`;
}
function dataOggiFineMese() {
  return normalizeDataFineMese(todayISO());
}
// Somma un numero intero di mesi a una data, ritorna la data risultante normalizzata a fine mese.
function addMesiISO(dataYMD, mesi) {
  const { y, m } = parseYMD(dataYMD);
  const idx = (y * 12 + (m - 1)) + Math.round(mesi);
  const ny = Math.floor(idx / 12);
  const nm = (idx % 12) + 1;
  return normalizeDataFineMese(`${ny}-${String(nm).padStart(2, "0")}-01`);
}
// Somma anni (interi) a una data "YYYY-MM-DD" come multiplo di 12 mesi. Ritorna "YYYY-MM-DD".
function addAnniISO(dataYMD, anni) {
  return addMesiISO(dataYMD, anni * 12);
}
// Frazione d'anno in dodicesimi fra due date: conta i mesi di calendario effettivi trascorsi (anno*12
// + mese) e divide per 12. Nessuna dipendenza da giorni reali o anni bisestili.
function calcolaAnniFrazionariMensili(dataInizioYMD, dataFineYMD) {
  const a = parseYMD(dataInizioYMD), b = parseYMD(dataFineYMD);
  const totaleMesi = (b.y - a.y) * 12 + (b.m - a.m);
  return totaleMesi / 12;
}
// (Nota: il montante di un singolo flusso indipendente non si calcola più isolatamente — vedi
// simulaProdotto più sotto, che gestisce capitalizzazione sequenziale con versamenti e prelievi.)
// Totale versato in un prodotto (capitale iniziale + versamenti aggiuntivi, se ammessi dal prodotto).
function totaleVersatoHolding(holding) {
  const extra = holding.permetteVersamenti ? (holding.flussiVersamenti || []).reduce((s, v) => s + (Number(v.importo) || 0), 0) : 0;
  return (Number(holding.importo) || 0) + extra;
}
// Copia dell'holding con capitale iniziale e versamenti scontati del costo di caricamento, da usare
// PRIMA della capitalizzazione (il costo di caricamento riduce il capitale investito, non il montante
// finale). Il caricamento "a cifra fissa" si applica per convenzione solo al versamento iniziale.
function netizzaCaricamento(holding) {
  if (holding.caricamentoTipo === "unitario") {
    return { ...holding, importo: Math.max(0, (Number(holding.importo) || 0) - (holding.caricamentoUnitario || 0)) };
  }
  const pct = (holding.caricamentoPct || 0) / 100;
  return {
    ...holding,
    importo: (Number(holding.importo) || 0) * (1 - pct),
    flussiVersamenti: (holding.flussiVersamenti || []).map((v) => ({ ...v, importo: (Number(v.importo) || 0) * (1 - pct) })),
  };
}

// Valore di un prodotto a una data target qualsiasi: somma, per ciascuna componente attiva (GS +
// Simulazione sequenziale del prodotto: costruisce la lista di eventi (versamento iniziale, ogni
// versamento aggiuntivo se ammessi, ogni prelievo se ammessi) ordinata cronologicamente, e capitalizza
// i saldi per-componente (GS + comparti) segmento per segmento fra un evento e il successivo, fino a
// dataTargetYMD. Necessaria perché un prelievo dipende dal montante accumulato fino a quel momento:
// non è più decomponibile in flussi indipendenti come nel motore precedente (puramente additivo).
// Un prelievo preleva dai saldi correnti in proporzione al loro peso ATTUALE (non alla quota % di
// configurazione originaria), coerente con un disinvestimento pro-quota dai fondi sottostanti.
// Nessun filtro di inclusione portafoglio né cutoff di scadenza: il prodotto è "vita intera" e la
// curva prosegue oltre la durata contrattuale target finché non è stata interamente riscattata.
function simulaProdotto(holding, storico, storicoGS, timeframeYears, scenarioKey, costiPerComponente, dataTargetYMD, modalita = "kid") {
  if (dataTargetYMD < holding.dataInvestimento) return { valore: 0, totalePrelieviNetti: 0, prelieviBloccati: [] };

  const components = getHoldingComponents(holding, storico, storicoGS, timeframeYears);
  const rates = components.map((c) => {
    const scenarioSet = modalita === "cagr" ? c.scenariCagr : c.scenari;
    let ratePct = scenarioKey ? scenarioSet[scenarioKey] : c.rateBase;
    if (costiPerComponente) ratePct = Math.max(0, ratePct - (costiPerComponente[c.key] || 0));
    return ratePct / 100;
  });

  const eventi = [];
  eventi.push({ data: holding.dataInvestimento, tipo: "versamento", importo: Number(holding.importo) || 0 });
  if (holding.permetteVersamenti) {
    (holding.flussiVersamenti || []).forEach((v) => {
      eventi.push({ data: v.data, tipo: "versamento", importo: Number(v.importo) || 0 });
    });
  }
  if (holding.permettePrelievi) {
    (holding.flussiPrelievi || []).forEach((p) => {
      eventi.push({ data: p.data, tipo: "prelievo", prelievoTipo: p.tipo, importoLordo: Number(p.importoLordo) || 0 });
    });
  }
  eventi.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));

  let saldi = components.map(() => 0);
  let dataCorrente = null;
  let totalePrelieviNetti = 0;
  let costBasisResiduo = 0; // capitale versato non ancora "recuperato" da prelievi precedenti
  const prelieviBloccati = [];

  for (const ev of eventi) {
    if (ev.data > dataTargetYMD) break;
    if (dataCorrente) {
      const t = calcolaAnniFrazionariMensili(dataCorrente, ev.data);
      if (t > 0) saldi = saldi.map((s, i) => s * Math.pow(1 + rates[i], t));
    }
    if (ev.tipo === "versamento") {
      saldi = saldi.map((s, i) => s + ev.importo * (components[i].pct / 100));
      costBasisResiduo += ev.importo;
    } else {
      const annoPolizza = Math.max(1, Math.ceil(calcolaAnniFrazionariMensili(holding.dataInvestimento, ev.data)));
      const riscatto = findRiscattoPct(holding.riscattoSchedule, annoPolizza);
      if (riscatto.bloccato) {
        // Prelievo non consentito in questo anno di polizza (ND): l'evento è ignorato, il capitale
        // resta investito e continua a capitalizzare invariato.
        prelieviBloccati.push({ data: ev.data, annoPolizza });
      } else {
        const totaleSaldi = saldi.reduce((s, v) => s + v, 0);
        const richiesto = ev.prelievoTipo === "totale" ? totaleSaldi : Math.min(ev.importoLordo, totaleSaldi);
        if (totaleSaldi > 0 && richiesto > 0) {
          // 1. Penale di riscatto sull'importo lordo richiesto.
          const montanteAlNettoPenale = richiesto * (1 - riscatto.pct / 100);

          // 2. Imposta: la fiscalità scatta SOLO qui (riscatto effettivo), mai passivamente alla
          // scadenza contrattuale. "plusvalenza" tassa solo la quota di guadagno proporzionale
          // nell'importo riscattato; "intero" tassa l'intero importo (al netto della sola penale).
          let impostaFiscale = 0;
          const aliquotaDecimale = (holding.aliquota ?? 26) / 100;
          if (holding.tipoImponibile === "intero") {
            impostaFiscale = montanteAlNettoPenale * aliquotaDecimale;
          } else {
            const guadagnoTotale = Math.max(0, totaleSaldi - costBasisResiduo);
            const quotaPlusvalenza = totaleSaldi > 0 ? guadagnoTotale / totaleSaldi : 0;
            impostaFiscale = montanteAlNettoPenale * quotaPlusvalenza * aliquotaDecimale;
          }
          totalePrelieviNetti += Math.max(0, montanteAlNettoPenale - impostaFiscale);

          // Riduce saldi e cost basis pro-quota rispetto al totale prelevato.
          saldi = saldi.map((s) => Math.max(0, s - richiesto * (s / totaleSaldi)));
          costBasisResiduo = Math.max(0, costBasisResiduo - costBasisResiduo * (richiesto / totaleSaldi));
        }
      }
    }
    dataCorrente = ev.data;
  }

  if (dataCorrente && dataCorrente < dataTargetYMD) {
    const t = calcolaAnniFrazionariMensili(dataCorrente, dataTargetYMD);
    if (t > 0) saldi = saldi.map((s, i) => s * Math.pow(1 + rates[i], t));
  }

  return { valore: Math.max(0, saldi.reduce((s, v) => s + v, 0)), totalePrelieviNetti, prelieviBloccati };
}

// Wrapper di sola lettura del valore (per i chiamanti che non necessitano del totale prelievi, es.
// la serie aggregata di portafoglio). Nessun cutoff a scadenza: prodotto a vita intera.
function getValoreProdottoAllaData(holding, storico, storicoGS, dataTargetYMD, timeframeYears, scenarioKey, costiPerComponente, modalita = "kid") {
  return simulaProdotto(holding, storico, storicoGS, timeframeYears, scenarioKey, costiPerComponente, dataTargetYMD, modalita).valore;
}

// Confronto fra il valore reale rendicontato (da estratto conto, a una data_controllo libera) e il
// valore teorico atteso dalla curva di proiezione originale alla stessa data — la curva NON viene
// mai ricalcolata o riancorata al dato reale, resta identica dal giorno 0 alla fine (si aggiunge solo
// un marker visivo sul grafico, vedi GrowthChart/puntiReali). Qui, a differenza del resto del motore,
// si usa deliberatamente la frazione d'anno su giorni reali (non i dodicesimi mensili): è un confronto
// puntuale isolato, non un nodo di una catena di capitalizzazione, quindi non è soggetto al rischio di
// overflow di calendario che aveva motivato il passaggio ai dodicesimi altrove.
function calcolaConsuntivoReale(holding, storico, storicoGS, timeframeYears) {
  if (!holding.consuntivoData || !(Number(holding.consuntivoValoreLordo) > 0)) return null;
  const dataInizio = new Date(holding.dataInvestimento);
  const dataControllo = new Date(holding.consuntivoData);
  const giorniTrascorsi = (dataControllo.getTime() - dataInizio.getTime()) / (1000 * 60 * 60 * 24);
  const anniTrascorsi = giorniTrascorsi / 365.25;
  if (anniTrascorsi <= 0) return null;

  const valoreLordoReale = Number(holding.consuntivoValoreLordo) || 0;
  const capitaleVersatoTotale = totaleVersatoHolding(holding);
  const valoreTeoricoAtteso = getValoreProdottoAllaData(holding, storico, storicoGS, holding.consuntivoData, timeframeYears, null, null);

  const rendimentoRealeAnnuo = capitaleVersatoTotale > 0
    ? (Math.pow(valoreLordoReale / capitaleVersatoTotale, 1 / anniTrascorsi) - 1) * 100
    : 0;
  const scostamentoEuro = valoreLordoReale - valoreTeoricoAtteso;
  const scostamentoPercentuale = valoreTeoricoAtteso > 0 ? (scostamentoEuro / valoreTeoricoAtteso) * 100 : 0;

  return {
    anniTrascorsi,
    valoreLordoReale,
    valoreTeoricoAtteso,
    rendimentoRealeAnnuo,
    scostamentoEuro,
    scostamentoPercentuale,
  };
}

// Curva di crescita del singolo prodotto, sul proprio asse "anni da T0": ora riflette anche i
// "gradini" di versamenti/prelievi (via simulaProdotto) e prosegue oltre la durata contrattuale
// (vita intera), non si azzera più alla scadenza target. Usa il tasso di base (storico/manuale),
// non i tassi KID/CAGR (indipendente dalla modalità). `importoOverride` non è più utilizzato (i
// flussi vivono sull'holding stesso) ma resta in firma per compatibilità del call-site esistente.
function buildGrowth(holding, storico, storicoGS, maxYears, importoOverride, timeframeYears) {
  const out = [];
  for (let y = 0; y <= maxYears; y++) {
    const dataYMD = addAnniISO(holding.dataInvestimento, y);
    out.push({ year: y, total: simulaProdotto(holding, storico, storicoGS, timeframeYears, null, null, dataYMD).valore });
  }
  return out;
}

// Proiezione lorda (costi/fiscalità esclusi) per uno specifico scenario, alla data di scadenza
// contrattuale target del prodotto (data investimento + anni) — non è una liquidazione forzata: è
// solo il punto di osservazione richiesto dalla Sintesi portafoglio. modalita seleziona se lo
// scenario è un tasso KID assoluto ("kid", default — comportamento invariato) oppure CAGR storico
// + scostamento in punti percentuali ("cagr"). totalePrelieviNetti (lordo, solo al netto della
// penale di riscatto per-evento) è informativo qui; il valore netto reale dei prelievi tiene conto
// anche dei costi di gestione, vedi summarizeNetScenario.
function summarizeGrossScenario(holding, storico, storicoGS, scenarioKey, timeframeYears, modalita = "kid") {
  const dataScadenza = addAnniISO(holding.dataInvestimento, holding.anni);
  const sim = simulaProdotto(holding, storico, storicoGS, timeframeYears, scenarioKey, null, dataScadenza, modalita);
  const capitaleFinale = sim.valore;
  const versato = totaleVersatoHolding(holding);
  const rendimentoPct = versato > 0 ? ((capitaleFinale - versato) / versato) * 100 : 0;
  return { capitaleIniziale: versato, capitaleFinale, rendimentoPct, prelieviNettiCumulati: sim.totalePrelieviNetti };
}

function summarizeGross(holding, storico, storicoGS, timeframeYears, modalita = "kid") {
  return summarizeGrossScenario(holding, storico, storicoGS, "potenziale", timeframeYears, modalita);
}

function summarizeAllScenarios(holding, storico, storicoGS, timeframeYears, modalita = "kid") {
  const out = {};
  SCENARIOS.forEach((k) => { out[k] = summarizeGrossScenario(holding, storico, storicoGS, k, timeframeYears, modalita); });
  return out;
}

// Soglia di riscatto applicabile in un dato anno di polizza, secondo il piano per-anno
// (riscattoSchedule, relativo alla data di investimento). Usa l'ultima soglia definita con
// anno <= annoPolizza; se l'anno è inferiore alla prima soglia, nessuna penale. Se la soglia
// applicabile è marcata bloccato:true ("ND" — prelievo non consentito in quell'anno), pct non va
// usato: il chiamante deve impedire il riscatto, non trattarlo come penale 0%.
function findRiscattoPct(schedule, annoPolizza) {
  if (!Array.isArray(schedule) || schedule.length === 0) return { pct: 0, bloccato: false };
  const applicabili = schedule.filter((e) => Number(e.anno) <= annoPolizza).sort((a, b) => b.anno - a.anno);
  if (!applicabili.length) return { pct: 0, bloccato: false };
  const soglia = applicabili[0];
  return { pct: soglia.bloccato ? 0 : Number(soglia.percentuale) || 0, bloccato: !!soglia.bloccato };
}

// Livello 2: costi/fiscalità applicati separatamente a ciascuna componente attiva (usando il
// rispettivo costo di gestione annua) prima di sommare i risultati, sulla stessa data di scadenza
// usata per lo scenario lordo. Il caricamento sconta capitale iniziale e versamenti prima della
// capitalizzazione (ciascun flusso al proprio tasso composto per il proprio numero di anni). Le
// penali sui prelievi intermedi (parziali o totali) sono già applicate evento per evento dentro
// simulaProdotto; pctUscita/costoUscitaImporto qui sotto riguardano SOLO il capitale residuo ancora
// in polizza alla scadenza target, non le somme già riscattate in precedenza.
function summarizeNetScenario(holding, storico, storicoGS, scenarioKey, timeframeYears, modalita = "kid") {
  if (!holding.layer2) return null;
  const dataScadenza = addAnniISO(holding.dataInvestimento, holding.anni);
  const gross = summarizeGrossScenario(holding, storico, storicoGS, scenarioKey, timeframeYears, modalita);

  const holdingNetizzato = netizzaCaricamento(holding);
  const simNetto = simulaProdotto(holdingNetizzato, storico, storicoGS, timeframeYears, scenarioKey, holding.costiGestioneComponenti, dataScadenza, modalita);
  const capitaleLordoConCosti = simNetto.valore;
  const prelieviNettiCumulati = simNetto.totalePrelieviNetti;

  const versato = gross.capitaleIniziale;
  const guadagnoLordo = Math.max(0, capitaleLordoConCosti - versato);
  const costoPerformance = guadagnoLordo * ((holding.performanceFee || 0) / 100);
  const capitaleDopoPerf = capitaleLordoConCosti - costoPerformance;
  const riscattoScadenza = findRiscattoPct(holding.riscattoSchedule, holding.anni);
  const pctUscita = riscattoScadenza.pct;
  const costoUscitaImporto = capitaleDopoPerf * (pctUscita / 100);
  const capitaleDopoCosti = capitaleDopoPerf - costoUscitaImporto;

  const guadagnoImponibile = Math.max(0, capitaleDopoCosti - versato); // solo informativo: non più tassato qui
  const imposta = 0; // la fiscalità non si applica più passivamente a scadenza: solo su un riscatto effettivo (vedi simulaProdotto)
  const capitaleNetto = capitaleDopoCosti;

  const costoCaricamentoGestione = Math.max(0, gross.capitaleFinale - capitaleLordoConCosti);

  return {
    capitaleLordo: gross.capitaleFinale,
    costoCaricamentoGestione,
    costoPerformance,
    costoUscitaImporto,
    pctUscita,
    bloccatoScadenza: riscattoScadenza.bloccato, // informativo: la scadenza cade in un anno "ND", il riscatto a quella data non sarebbe consentito
    capitaleDopoCosti,
    imposta,
    capitaleNetto,
    versato,
    prelieviNettiCumulati,
    prelieviBloccati: simNetto.prelieviBloccati,
    valoreResiduo: capitaleNetto,
    rendimentoNettoPct: versato > 0 ? ((capitaleNetto - versato) / versato) * 100 : 0,
  };
}

function summarizeNet(holding, storico, storicoGS, timeframeYears, modalita = "kid") {
  return summarizeNetScenario(holding, storico, storicoGS, "potenziale", timeframeYears, modalita);
}

function summarizeAllScenariosNet(holding, storico, storicoGS, timeframeYears, modalita = "kid") {
  if (!holding.layer2) return null;
  const out = {};
  SCENARIOS.forEach((k) => { out[k] = summarizeNetScenario(holding, storico, storicoGS, k, timeframeYears, modalita); });
  return out;
}

function displayFinal(holding, storico, storicoGS, timeframeYears, modalita = "kid") {
  const net = summarizeNet(holding, storico, storicoGS, timeframeYears, modalita);
  if (net) return { value: net.capitaleNetto, isNet: true };
  return { value: summarizeGross(holding, storico, storicoGS, timeframeYears, modalita).capitaleFinale, isNet: false };
}

function scenarioFinalValue(holding, storico, storicoGS, scenarioKey, timeframeYears, modalita = "kid") {
  const net = summarizeNetScenario(holding, storico, storicoGS, scenarioKey, timeframeYears, modalita);
  if (net) return { value: net.capitaleNetto, isNet: true, rendPct: net.rendimentoNettoPct };
  const gross = summarizeGrossScenario(holding, storico, storicoGS, scenarioKey, timeframeYears, modalita);
  return { value: gross.capitaleFinale, isNet: false, rendPct: gross.rendimentoPct };
}

// ---------- Timeline assoluta di portafoglio (asse condiviso a date reali) ----------
// Punti dell'asse: passi annuali costanti al 31/12 (nessuna data esatta come nodo — vedi
// buildTimelineAssoluta più sotto per il razionale), dall'anno di ingresso del prodotto attivo più
// vecchio fino alla scadenza più lontana estesa per la vita intera.
function buildTimelineAssoluta(holdingsAttivi) {
  if (!holdingsAttivi.length) return [];
  let annoMin = Infinity, annoMax = -Infinity;

  holdingsAttivi.forEach((h) => {
    const annoInizio = parseYMD(normalizeDataFineMese(h.dataInvestimento)).y;
    // Estende oltre la scadenza contrattuale (+30%, coerente con l'orizzonte del grafico per
    // singolo prodotto) per mostrare la prosecuzione a vita intera anche sull'asse condiviso.
    const annoFineEsteso = annoInizio + Math.ceil(h.anni * 1.3);
    annoMin = Math.min(annoMin, annoInizio);
    annoMax = Math.max(annoMax, annoFineEsteso);
  });

  // Passi costanti annuali al 31/12: nessuna data esatta (T0, versamenti, scadenze) viene inserita
  // come nodo della curva, per evitare cambi di pendenza dovuti a intervalli non omogenei fra i
  // punti. Le date esatte restano gestite solo come linee di riferimento visive (vedi
  // GrowthChartAssoluto), calcolate internamente da simulaProdotto indipendentemente dai nodi qui.
  const punti = [];
  for (let anno = annoMin; anno <= annoMax; anno++) {
    punti.push(`${anno}-12-31`);
  }
  return punti;
}

// Serie aggregata del portafoglio sull'asse a date reali: per ciascun punto della timeline, somma il
// valore di tutti i prodotti attivi (inclusoInPortafoglio) a quella data, usando il tasso di base di
// ciascuna componente (curva "storica/manuale", coerente con la Curva di crescita del singolo
// prodotto). I prodotti la cui data di investimento è successiva al punto restano a 0 fino ad allora.
function buildAggregatePortfolioSeries(holdingsAttivi, storico, storicoGS, timeframeYears) {
  const timeline = buildTimelineAssoluta(holdingsAttivi);
  return timeline.map((dataYMD) => {
    const totale = holdingsAttivi.reduce((s, h) => s + getValoreProdottoAllaData(h, storico, storicoGS, dataYMD, timeframeYears, null, null), 0);
    return { dataYMD, totale };
  });
}


// ---------- Holding card ----------
function HoldingCard({ holding, idx, storico, storicoGS, prodottiConfig, costiPredefiniti, setCostiPredefiniti, timeframeYears, onUpdate, onRemove, canRemove }) {
  const color = colorFor(idx);
  const update = (field, value) => onUpdate(holding.id, { ...holding, [field]: value });
  const [modalOpen, setModalOpen] = useState(false);

  const isCustomName = holding.nomeKey === CUSTOM_KEY;
  const dynamicProductNames = Array.from(new Set(prodottiConfig.map((p) => p.nomeProdotto.trim()).filter(Boolean)));
  const isConfigured = holding.nomeKey !== "";

  const handleNomeChange = (val) => {
    if (val === "" || val === CUSTOM_KEY) {
      onUpdate(holding.id, { ...holding, nomeKey: val });
      return;
    }
    const mapped = prodottiConfig.find((p) => p.nomeProdotto === val);
    if (mapped) {
      // Automazione: snapshot da Appendice — Configurazione Prodotti (GS, comparti, scenari KID).
      // Da qui in poi la scheda è indipendente dal template: modificabile per il singolo cliente.
      const gsRow = mapped.nomeFondoGS ? (storicoGS || []).find((r) => r.nome === mapped.nomeFondoGS) : null;
      const nuoviComparti = (mapped.comparti || []).map((c) => {
        const isGS = c.tipo === "gs";
        const fonteRow = c.nomeComparto ? (isGS ? (storicoGS || []) : storico).find((r) => r.nome === c.nomeComparto) : null;
        return defaultCompartoHolding({
          nomeComparto: c.nomeComparto,
          tipo: isGS ? "gs" : "mr",
          multiramoFonte: fonteRow ? fonteRow.id : "manuale",
          pct: c.pct,
          anniCagr: clampTimeframe(c.anniCagr),
          ott: c.ott,
          mod: c.mod,
          pru: c.pru,
          deltaOtt: c.deltaOtt,
          deltaMod: c.deltaMod,
          deltaPru: c.deltaPru,
        });
      });
      onUpdate(holding.id, {
        ...holding,
        nomeKey: val,
        gsAssociata: mapped.gsAssociata,
        gsPct: mapped.gsPct,
        gsFonte: gsRow ? gsRow.id : "manuale",
        gsOtt: mapped.gsOtt,
        gsMod: mapped.gsMod,
        gsPru: mapped.gsPru,
        gsDeltaOtt: mapped.gsDeltaOtt,
        gsDeltaMod: mapped.gsDeltaMod,
        gsDeltaPru: mapped.gsDeltaPru,
        comparti: nuoviComparti.length ? nuoviComparti : holding.comparti,
        permetteVersamenti: !!mapped.permetteVersamenti,
        permettePrelievi: mapped.permettePrelievi !== undefined ? !!mapped.permettePrelievi : true,
      });
      return;
    }
    onUpdate(holding.id, { ...holding, nomeKey: val });
  };

  const updateComparto = (compId, field, value) => {
    update("comparti", holding.comparti.map((c) => (c.id === compId ? { ...c, [field]: value } : c)));
  };
  const addComparto = () => update("comparti", [...holding.comparti, defaultCompartoHolding({ pct: 0 })]);
  const removeComparto = (compId) => update("comparti", holding.comparti.filter((c) => c.id !== compId));

  const totalPct = totalPctHolding(holding);
  const isValidPct = Math.round(totalPct * 100) / 100 === 100;

  const gsSourceRow = holding.gsFonte && holding.gsFonte !== "manuale" ? (storicoGS || []).find((r) => r.id === holding.gsFonte) : null;
  const resolvedRateGS = resolveRateGS(holding, storicoGS, timeframeYears);

  // Componenti attive (per badge costi nella modale e per etichette).
  // Nomi componenti per la modale Costi: se il nome sul comparto dell'holding è vuoto (es. comparto
  // aggiunto a mano prima di essere rinominato), recupera il nome dal template di Configurazione
  // Prodotti corrispondente (stesso indice di posizione), prima di ricadere su un'etichetta generica.
  const configMatchPerNomi = prodottiConfig.find((p) => p.nomeProdotto === holding.nomeKey) || null;
  const components = [];
  if (holding.gsAssociata) {
    const nomeGS = gsSourceRow ? gsSourceRow.nome : (configMatchPerNomi && configMatchPerNomi.nomeFondoGS) || "Gestione Separata";
    components.push({ key: "gs", label: nomeGS });
  }
  (holding.comparti || []).forEach((c, i) => {
    const nomeFallback = configMatchPerNomi && configMatchPerNomi.comparti[i] ? configMatchPerNomi.comparti[i].nomeComparto : "";
    components.push({ key: c.id, label: c.nomeComparto || nomeFallback || `Comparto ${i + 1}` });
  });

  const openCostsModal = () => {
    if (!holding.costiConfigurati) {
      const matchConfig = prodottiConfig.find((p) => p.nomeProdotto === holding.nomeKey);
      const preset = matchConfig ? (costiPredefiniti || []).find((p) => p.prodottoId === matchConfig.id) : null;
      if (preset) {
        const nuoviCosti = {};
        components.forEach((c) => {
          if (preset.gestioneComponenti && preset.gestioneComponenti[c.label] !== undefined) {
            nuoviCosti[c.key] = preset.gestioneComponenti[c.label];
          }
        });
        onUpdate(holding.id, {
          ...holding,
          layer2: true,
          costiConfigurati: true,
          caricamentoTipo: preset.caricamentoTipo ?? holding.caricamentoTipo,
          caricamentoPct: preset.caricamentoPct ?? holding.caricamentoPct,
          caricamentoUnitario: preset.caricamentoUnitario ?? holding.caricamentoUnitario,
          riscattoSchedule: Array.isArray(preset.riscattoSchedule) ? preset.riscattoSchedule : holding.riscattoSchedule,
          performanceFee: preset.performanceFee ?? holding.performanceFee,
          aliquota: preset.aliquota ?? holding.aliquota,
          tipoImponibile: preset.tipoImponibile ?? holding.tipoImponibile,
          prodottoAssicurativo: preset.prodottoAssicurativo ?? holding.prodottoAssicurativo,
          costiGestioneComponenti: { ...holding.costiGestioneComponenti, ...nuoviCosti },
        });
      } else {
        onUpdate(holding.id, { ...holding, layer2: true, costiConfigurati: true });
      }
    }
    // Se i costi sono già stati configurati in precedenza, il click apre solo la modale di
    // modifica: non tocca lo stato lordo/netto (holding.layer2), che si governa con l'interruttore.
    setModalOpen(true);
  };

  const addVersamento = () => {
    const ultimo = holding.flussiVersamenti.length ? holding.flussiVersamenti[holding.flussiVersamenti.length - 1].data : holding.dataInvestimento;
    update("flussiVersamenti", [...holding.flussiVersamenti, defaultVersamento({ data: addAnniISO(ultimo, 1) })]);
  };
  const updateVersamento = (vid, field, value) => {
    update("flussiVersamenti", holding.flussiVersamenti.map((v) => (v.id === vid ? { ...v, [field]: value } : v)));
  };
  const removeVersamento = (vid) => update("flussiVersamenti", holding.flussiVersamenti.filter((v) => v.id !== vid));

  const addPrelievo = () => {
    const ultimo = holding.flussiPrelievi.length ? holding.flussiPrelievi[holding.flussiPrelievi.length - 1].data : holding.dataInvestimento;
    update("flussiPrelievi", [...holding.flussiPrelievi, defaultPrelievo({ data: addAnniISO(ultimo, 1) })]);
  };
  const updatePrelievo = (pid, field, value) => {
    update("flussiPrelievi", holding.flussiPrelievi.map((p) => (p.id === pid ? { ...p, [field]: value } : p)));
  };
  const removePrelievo = (pid) => update("flussiPrelievi", holding.flussiPrelievi.filter((p) => p.id !== pid));

  return (
    <div className="panel" style={{ "--accent": color }}>
      <div className="panel-head">
        <span className="dot" />
        <h2>{slotLabel(idx)}</h2>
        {isConfigured && (
          <label className="incluso-toggle" title="Escludi/includi questo prodotto dai grafici e dalla sintesi di portafoglio, senza eliminarlo">
            <input type="checkbox" checked={holding.inclusoInPortafoglio} onChange={(e) => update("inclusoInPortafoglio", e.target.checked)} />

              <div className="riscatto-list">
                {holding.flussiPrelievi.map((p) => (
                  <div key={p.id} className="riscatto-row">
                    <span>Data</span>
                    <input type="date" className="date-field date-field-small" value={p.data} onChange={(e) => e.target.value && updatePrelievo(p.id, "data", normalizeDataFineMese(e.target.value))} />

            <span className="prefix">€</span>

          </div>
          <input
            type="text"
            className="prodcfg-text"
            placeholder="Note (es. Estratto conto al 3° anno)"

            onChange={(e) => update("consuntivoNote", e.target.value)}
            style={{ marginTop: 8, width: "100%" }}
          />
          {(() => {
            const consuntivo = calcolaConsuntivoReale(holding, storico, storicoGS, timeframeYears);
            if (!consuntivo) return null;
            const scostamentoPositivo = consuntivo.scostamentoEuro >= 0;
            return (
              <div className="consuntivo-box">
                <div className="consuntivo-row">
                  <span>Tempo trascorso</span>
                  <strong>{consuntivo.anniTrascorsi.toFixed(2)} anni</strong>
                </div>
                <div className="consuntivo-row">
                  <span>Valore teorico atteso a quella data</span>
                  <strong>{eur(consuntivo.valoreTeoricoAtteso)}</strong>
                </div>
                <div className="consuntivo-row">
                  <span>Rendimento annuo reale (CAGR)</span>
                  <strong>{consuntivo.rendimentoRealeAnnuo.toFixed(2)}%</strong>
                </div>
                <div className="consuntivo-row">
                  <span>Scostamento vs stima</span>
                  <strong className={scostamentoPositivo ? "consuntivo-positivo" : "consuntivo-negativo"}>
                    {scostamentoPositivo ? "+" : ""}{eur(consuntivo.scostamentoEuro)} ({scostamentoPositivo ? "+" : ""}{consuntivo.scostamentoPercentuale.toFixed(2)}%)
                  </strong>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {!isConfigured && (
        <p className="select-prompt">Seleziona un prodotto per abilitare i calcoli di questa scheda.</p>
      )}

      {isConfigured && (
        <div className="badge">
          <div className="badge-label">
            Composizione
            <span className={isValidPct ? "value-pill" : "value-pill pill-error"}>{totalPct.toFixed(1)}% {isValidPct ? "✓" : "≠ 100%"}</span>
          </div>

          {/* Gestione Separata */}
          <div className="holding-component gs-component">
            <div className="holding-component-head">
              <label className="ins-check" style={{ marginRight: 10 }}>
                <input type="checkbox" checked={holding.gsAssociata} onChange={(e) => update("gsAssociata", e.target.checked)} />
                Gestione Separata
              </label>
              {holding.gsAssociata && (
                <>
                  <div className="input-row small" style={{ maxWidth: 90 }}>
                    <NumField min={0} max={100} step={1} value={holding.gsPct} onChange={(v) => update("gsPct", Math.min(100, Math.max(0, v)))} />
                    <span className="suffix">%</span>
                  </div>
                </>
              )}
            </div>
            {holding.gsAssociata && (
              <div className="mr-source">
                <select className="select-field" value={holding.gsFonte || "manuale"} onChange={(e) => update("gsFonte", e.target.value)}>
                  <option value="manuale">Manuale</option>
                  {(storicoGS || []).filter((r) => r.nome.trim() !== "").map((r) => (
                    <option key={r.id} value={r.id}>{r.nome} (storico)</option>
                  ))}
                </select>
                {(!holding.gsFonte || holding.gsFonte === "manuale") ? (
                  <div className="input-row small" style={{ marginTop: 6 }}>
                    <NumField min={0} max={10} step={0.05} value={holding.rateGSManuale} onChange={(v) => update("rateGSManuale", Math.min(10, Math.max(0, v)))} />
                    <span className="suffix">%</span>
                  </div>
                ) : (
                  <div className="mr-readout">
                    CAGR storico ({effectiveYearsUsed(gsSourceRow ? gsSourceRow.rendimenti : [], gsSourceRow ? gsSourceRow.orizzonteCagr : timeframeYears, gsSourceRow ? gsSourceRow.annoPiuRecente : undefined, annoFineFinestraDaData(holding.dataInvestimento))}a
                    su {gsSourceRow ? gsSourceRow.orizzonteCagr : timeframeYears}a, anni {annoFineFinestraDaData(holding.dataInvestimento) - (gsSourceRow ? gsSourceRow.orizzonteCagr : timeframeYears) + 1}–{annoFineFinestraDaData(holding.dataInvestimento)}: <strong>{resolvedRateGS.toFixed(2)}%</strong>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Componenti Aggiuntive (lista dinamica): Comparti Multiramo oppure Gestioni Separate
              aggiuntive (prodotti "doppia GS") */}
          {holding.comparti.map((c) => {
            const isGS = c.tipo === "gs";
            const fonteList = isGS ? (storicoGS || []) : storico;
            const fonteRow = c.multiramoFonte !== "manuale" ? fonteList.find((r) => r.id === c.multiramoFonte) : null;
            const anniCagrFondo = fonteRow ? clampTimeframe(fonteRow.orizzonteCagr) : null;
            const annoFineFinestraMR = annoFineFinestraDaData(holding.dataInvestimento);
            const rate = fonteRow ? cagrFromReturns(fonteRow.rendimenti, anniCagrFondo, fonteRow.annoPiuRecente, annoFineFinestraMR) : c.rateMRManuale;
            return (
              <div key={c.id} className={isGS ? "holding-component gs-component" : "holding-component mr-component"}>
                <div className="holding-component-head">
                  <select className="select-field" style={{ maxWidth: 70 }} value={isGS ? "gs" : "mr"} onChange={(e) => update("comparti", holding.comparti.map((cc) => (cc.id === c.id ? { ...cc, tipo: e.target.value, multiramoFonte: "manuale" } : cc)))}>
                    <option value="mr">MR</option>
                    <option value="gs">GS</option>
                  </select>
                  <input
                    type="text"
                    className="prodcfg-text"
                    placeholder={isGS ? "Nome Gestione Separata" : "Nome comparto"}
                    value={c.nomeComparto}
                    onChange={(e) => updateComparto(c.id, "nomeComparto", e.target.value)}
                  />
                  <div className="input-row small" style={{ maxWidth: 90 }}>
                    <NumField min={0} max={100} step={1} value={c.pct} onChange={(v) => updateComparto(c.id, "pct", Math.min(100, Math.max(0, v)))} />

                  </div>
                  {holding.comparti.length > 1 && (

                      <option key={r.id} value={r.id}>{r.nome} (storico)</option>

                  {c.multiramoFonte === "manuale" ? (
                    <div className="input-row small" style={{ marginTop: 6 }}>
                      <NumField min={0} max={20} step={0.1} value={c.rateMRManuale} onChange={(v) => updateComparto(c.id, "rateMRManuale", Math.min(20, Math.max(0, v)))} />
                      <span className="suffix">%</span>
                    </div>

                    <div className="mr-readout">
                      CAGR storico ({effectiveYearsUsed(fonteRow ? fonteRow.rendimenti : [], anniCagrFondo, fonteRow ? fonteRow.annoPiuRecente : undefined, annoFineFinestraMR)}a
                      su {anniCagrFondo}a, anni {annoFineFinestraMR - anniCagrFondo + 1}–{annoFineFinestraMR}: <strong>{rate.toFixed(2)}%</strong>
                    </div>

            );
          })}
          <button className="add-row-btn" onClick={addComparto}>+ Aggiungi Comparto Multiramo</button>
        </div>
      )}

      <div className="badge layer2-toggle" style={{ marginTop: 14 }}>
        <div className="layer2-control">
          <button className={holding.layer2 ? "layer2-btn active" : "layer2-btn"} disabled={!isConfigured} onClick={openCostsModal}>
            {!holding.costiConfigurati ? "+ Aggiungi Costi e Fiscalità" : holding.layer2 ? "✓ Costi Applicati (Netto) — modifica" : "Costi Esclusi (Lordo) — modifica"}
          </button>
          {holding.costiConfigurati && (
            <label className="layer2-switch" title="Attiva/disattiva l'applicazione dei costi al calcolo, senza perdere i valori inseriti">
              <input type="checkbox" checked={holding.layer2} onChange={(e) => update("layer2", e.target.checked)} />
              <span>{holding.layer2 ? "Netto" : "Lordo"}</span>

        <CostsModal
          holding={holding}

          onUpdate={(next) => onUpdate(holding.id, next)}
