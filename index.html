}

function CostsModal({ holding, components, prodottiConfig, onUpdate, onClose, costiPredefiniti, setCostiPredefiniti }) {
  const update = (field, value) => onUpdate({ ...holding, [field]: value });
  const updateCosto = (key, value) => update("costiGestioneComponenti", { ...holding.costiGestioneComponenti, [key]: value });

  const updateRiscatto = (i, field, value) => {
    const next = holding.riscattoSchedule.slice();
    next[i] = { ...next[i], [field]: value };
    update("riscattoSchedule", next);
  };
  const addRiscatto = () => {
    const nextAnno = holding.riscattoSchedule.length ? Math.max(...holding.riscattoSchedule.map((e) => Number(e.anno) || 0)) + 1 : 1;
    update("riscattoSchedule", [...holding.riscattoSchedule, { anno: nextAnno, percentuale: 0, bloccato: false }]);
  };
  const removeRiscatto = (i) => update("riscattoSchedule", holding.riscattoSchedule.filter((_, idx) => idx !== i));

  const matchedProdottoId = (prodottiConfig.find((p) => p.nomeProdotto === holding.nomeKey) || {}).id || "";

  const saveAsDefault = () => {
    if (!matchedProdottoId) return;
    const gestioneComponenti = {};
    components.forEach((c) => {
      const v = holding.costiGestioneComponenti && holding.costiGestioneComponenti[c.key];
      if (v !== undefined) gestioneComponenti[c.label] = v;
    });
    const record = {
      id: nextId("cp"),
      prodottoId: matchedProdottoId,
      caricamentoTipo: holding.caricamentoTipo,
      caricamentoPct: holding.caricamentoPct,
      caricamentoUnitario: holding.caricamentoUnitario,
      riscattoSchedule: holding.riscattoSchedule,
      performanceFee: holding.performanceFee,
      aliquota: holding.aliquota,
      tipoImponibile: holding.tipoImponibile,
      prodottoAssicurativo: holding.prodottoAssicurativo,
      gestioneComponenti,
    };
    setCostiPredefiniti((prev) => {
      const existingIdx = prev.findIndex((p) => p.prodottoId === matchedProdottoId);
      if (existingIdx === -1) return [...prev, record];
      const next = prev.slice();
      next[existingIdx] = { ...record, id: prev[existingIdx].id };
      return next;
    });
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3>Costi e Fiscalità — {holding.nomeKey === CUSTOM_KEY ? (holding.nomeCustom || "Prodotto") : holding.nomeKey}</h3>
          <button className="remove-btn" onClick={onClose}>×</button>
        </div>

        <div className="cost-grid">
          <div className="cost-cell-wide">
            <div className="cost-label-row">
              <span className="cost-label">Costi di ingresso</span>
              <div className="mini-seg">
                <button type="button" className={holding.caricamentoTipo === "percentuale" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => update("caricamentoTipo", "percentuale")}>%</button>
                <button type="button" className={holding.caricamentoTipo === "unitario" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => update("caricamentoTipo", "unitario")}>€</button>
              </div>
            </div>
            {holding.caricamentoTipo === "unitario" ? (
              <div className="input-row small">
                <span className="prefix">€</span>
                <CurrencyField min={0} value={holding.caricamentoUnitario} onChange={(v) => update("caricamentoUnitario", Math.max(0, v))} />
              </div>
            ) : (
              <div className="input-row small">
                <NumField min={0} max={15} step={0.1} value={holding.caricamentoPct} onChange={(v) => update("caricamentoPct", Math.min(15, Math.max(0, v)))} />
                <span className="suffix">%</span>
              </div>
            )}
          </div>
          <div>
            <div className="cost-label">Comm. performance</div>
            <div className="input-row small">
              <NumField min={0} max={30} step={1} value={holding.performanceFee} onChange={(v) => update("performanceFee", Math.min(30, Math.max(0, v)))} />
              <span className="suffix">%</span>
            </div>
          </div>
        </div>

        <div className="badge-label" style={{ marginTop: 14 }}>Gestione annua per componente</div>
        <div className="cost-grid">
          {components.map((c) => (
            <div key={c.key}>
              <div className="cost-label">{c.label}</div>
              <div className="input-row small">
                <NumField
                  min={0}
                  max={5}
                  step={0.05}
                  value={(holding.costiGestioneComponenti && holding.costiGestioneComponenti[c.key]) || 0}
                  onChange={(v) => updateCosto(c.key, Math.min(5, Math.max(0, v)))}
                />
                <span className="suffix">%</span>
              </div>
            </div>
          ))}
        </div>

        <div className="badge-label" style={{ marginTop: 14 }}>Piano penali di riscatto (per anno di uscita)</div>
        <div className="riscatto-list">
          {holding.riscattoSchedule.map((e, i) => (
            <div key={i} className="riscatto-row">
              <span>Anno</span>
              <NumField min={1} max={40} step={1} value={e.anno} onChange={(v) => updateRiscatto(i, "anno", Math.max(1, Math.round(v)))} />
              {e.bloccato ? (
                <span className="nd-tag">ND — prelievo non consentito</span>
              ) : (
                <>
                  <span>→ penale</span>
                  <NumField min={0} max={20} step={0.1} value={e.percentuale} onChange={(v) => updateRiscatto(i, "percentuale", Math.min(20, Math.max(0, v)))} />
                  <span className="suffix">%</span>
                </>
              )}
              <label className="ins-check ins-check-inline">
                <input type="checkbox" checked={!!e.bloccato} onChange={(ev) => updateRiscatto(i, "bloccato", ev.target.checked)} />
                ND
              </label>
              <button className="storico-remove" onClick={() => removeRiscatto(i)} title="Rimuovi soglia">×</button>
            </div>
          ))}
          <button className="add-row-btn" onClick={addRiscatto}>+ Aggiungi soglia anno</button>
        </div>

        <div className="badge-label" style={{ marginTop: 14 }}>Fiscalità <span className="value-pill">{holding.aliquota}%</span></div>
        <input type="range" min="12.5" max="26" step="0.5" value={holding.aliquota} onChange={(e) => update("aliquota", Number(e.target.value))} className="slider" />
        <div className="comp-row">
          <span>12,5% (es. titoli di Stato)</span>
          <span>26% (aliquota ordinaria)</span>
        </div>

        <div className="mini-seg" style={{ marginTop: 10 }}>
          <button type="button" className={holding.tipoImponibile === "plusvalenza" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => update("tipoImponibile", "plusvalenza")}>Solo Plusvalenza</button>
          <button type="button" className={holding.tipoImponibile === "intero" ? "mini-seg-btn active" : "mini-seg-btn"} onClick={() => update("tipoImponibile", "intero")}>Intero Montante</button>
        </div>
        <p className="hint" style={{ marginTop: 6 }}>
          L'imposta verrà applicata esclusivamente in caso di riscatto parziale o totale, e non alla semplice
          scadenza contrattuale (il prodotto prosegue a vita intera). "Solo Plusvalenza" tassa solo la quota di
          guadagno proporzionale nell'importo riscattato; "Intero Montante" tassa l'intero importo riscattato
          (al netto della sola penale di riscatto).
        </p>

        <label className="ins-check" style={{ marginTop: 10 }}>
          <input type="checkbox" checked={holding.prodottoAssicurativo} onChange={(e) => update("prodottoAssicurativo", e.target.checked)} />
          Prodotto assicurativo (polizza vita / IBIP)
        </label>

        <div className="modal-actions">
          <button className="save-default-btn" onClick={saveAsDefault} disabled={!matchedProdottoId}>
            Salva come predefinito per "{holding.nomeKey}"
          </button>
          <button className="layer2-btn active" onClick={onClose}>Chiudi</button>
        </div>
        <p className="hint" style={{ marginTop: 8 }}>
          Le modifiche qui sopra valgono solo per questa scheda cliente. "Salva come predefinito" aggiorna
          l'Appendice — Costi e Fiscalità Predefiniti, usata per pre-compilare le prossime schede con lo stesso prodotto.
        </p>
      </div>
    </div>
  );
}

// ---------- Pie chart (hand-built SVG) ----------
function polarToCartesian(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function arcPath(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return ["M", cx, cy, "L", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y, "Z"].join(" ");
}
// Spicchio ad anello (donut): arco esterno + arco interno di ritorno, invece di un settore pieno
// dal centro. rOuter/rInner indipendenti per permettere l'effetto "ingrandimento" al passaggio del
// mouse (si aumenta solo rOuter dello spicchio interessato).
function donutArcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const startOuter = polarToCartesian(cx, cy, rOuter, endAngle);
  const endOuter = polarToCartesian(cx, cy, rOuter, startAngle);
  const startInner = polarToCartesian(cx, cy, rInner, startAngle);
  const endInner = polarToCartesian(cx, cy, rInner, endAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return [
    "M", startOuter.x, startOuter.y,
    "A", rOuter, rOuter, 0, largeArcFlag, 0, endOuter.x, endOuter.y,
    "L", startInner.x, startInner.y,
    "A", rInner, rInner, 0, largeArcFlag, 1, endInner.x, endInner.y,
    "Z",
  ].join(" ");
}

// Tracciato di un anello (donut) COMPLETO — usato quando uno spicchio copre l'intera
// circonferenza (un solo comparto/prodotto attivo, cioè il 100%). Un normale arco SVG con
// startAngle=0 ed endAngle=360 degenera: i due estremi coincidono nello stesso punto e il
// tracciato risulta vuoto/invisibile. Qui l'anello viene invece composto da due semicerchi
// (esterno ed interno) con fill-rule evenodd, che produce sempre un anello pieno e corretto.
function donutFullRingPath(cx, cy, rOuter, rInner) {
  return [
    `M ${cx} ${cy - rOuter}`,
    `A ${rOuter} ${rOuter} 0 1 1 ${cx} ${cy + rOuter}`,
    `A ${rOuter} ${rOuter} 0 1 1 ${cx} ${cy - rOuter}`,
    "Z",
    `M ${cx} ${cy - rInner}`,
    `A ${rInner} ${rInner} 0 1 1 ${cx} ${cy + rInner}`,
    `A ${rInner} ${rInner} 0 1 1 ${cx} ${cy - rInner}`,
    "Z",
  ].join(" ");
}

// Banner circolare che appare nel foro centrale dell'anello quando uno spicchio è selezionato:
// cerchio coordinato all'innerRadius, sfondo/bordo del colore dello spicchio, con nome in alto e
// percentuale + importo in basso. key={activeIdx} nel chiamante forza il remount e riavvia
// l'animazione di dissolvenza (3,5s, poi torna al contenuto di default del genitore).
function DonutCenterBanner({ rInner, color, name, pct, importo }) {
  const diameter = (rInner - 4) * 2;
  return (
    <div
      className="donut-center-banner"
      style={{ width: diameter, height: diameter, backgroundColor: `${color}26`, borderColor: color }}
    >
      <div className="donut-center-banner-nome" style={{ color }}>{name}</div>
      <div className="donut-center-banner-pct">{pct.toFixed(1)}%</div>
      <div className="donut-center-banner-val">{eur(importo)}</div>
    </div>
  );
}

// Interpola linearmente fra due colori esadecimali (#RRGGBB), t in [0,1].
function interpolaColoreHex(colorA, colorB, t) {
  const a = colorA.replace("#", "");
  const b = colorB.replace("#", "");
  const parse = (h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  const [ar, ag, ab] = parse(a);
  const [br, bg, bb] = parse(b);
  const mix = (x, y) => Math.round(x + (y - x) * t);
  const toHex = (n) => n.toString(16).padStart(2, "0");
  return `#${toHex(mix(ar, br))}${toHex(mix(ag, bg))}${toHex(mix(ab, bb))}`;
}

// Aggrega, su tutti i prodotti attivi in portafoglio, il capitale per macro-famiglia (Gestione
// Separata vs Comparti Multiramo), usando il totale versato (capitale iniziale + versamenti) di
// ciascun prodotto ripartito secondo il peso % di ciascuna componente — stessa logica del motore.
function calcolaMacroAllocazione(rows, storico, storicoGS, timeframeYears) {
  let totaleGS = 0, totaleMR = 0;
  rows.forEach((r) => {
    const versato = totaleVersatoHolding(r.holding);
    getHoldingComponents(r.holding, storico, storicoGS, timeframeYears).forEach((c) => {
      const quota = versato * (c.pct / 100);
      if (c.tipo === "gs") totaleGS += quota;
      else totaleMR += quota;
    });
  });
  return { totaleGS, totaleMR };
}

// Dettaglio dei singoli comparti/GS sottostanti attivi in portafoglio (non solo GS vs MR aggregato):
// unisce per nome del fondo/comparto (stesso fondo usato da più prodotti conta una volta sola, capitale
// sommato). Gli elementi restano raggruppati per famiglia (prima la Gestione Separata, poi il Multiramo)
// così l'anello unico mostra sia la ripartizione macro sia i singoli comparti attivi; ogni comparto
// riceve un colore dalla nuova palette dashboard, assegnato dinamicamente per indice.
function calcolaDettaglioComponenti(rows, storico, storicoGS, timeframeYears) {
  const mappa = new Map(); // label -> { label, tipo, importo }
  rows.forEach((r) => {
    const versato = totaleVersatoHolding(r.holding);
    getHoldingComponents(r.holding, storico, storicoGS, timeframeYears).forEach((c) => {
      const quota = versato * (c.pct / 100);
      if (quota <= 0) return;
      const key = `${c.tipo}::${c.label}`;
      if (mappa.has(key)) {
        mappa.get(key).importo += quota;
      } else {
        mappa.set(key, { label: c.label, tipo: c.tipo, importo: quota });
      }
    });
  });
  const gs = Array.from(mappa.values()).filter((x) => x.tipo === "gs").sort((a, b) => b.importo - a.importo);
  const mr = Array.from(mappa.values()).filter((x) => x.tipo === "mr").sort((a, b) => b.importo - a.importo);
  return [...gs, ...mr].map((x, i) => ({ ...x, color: getColoreElemento(i) }));
}

function PieChart({ slices }) {
  const total = slices.reduce((s, x) => s + x.importo, 0);
  const cx = 130, cy = 130, rOuter = 110, rInner = 62;
  const [activeIdx, setActiveIdx] = useState(null);
  const timerRef = useRef(null);
  let cum = 0;
  const parts = slices.map((s) => {
    const fraction = total > 0 ? s.importo / total : 0;
    const start = cum * 360;
    cum += fraction;
    const end = cum * 360;
    const mid = (start + end) / 2;
    return { ...s, fraction, start, end, mid };
  });
  // Fix bug "prodotto singolo (100%)": un solo spicchio pari all'intera circonferenza degenera in
  // un arco SVG a estremi coincidenti (invisibile). In questo caso disegna un anello pieno.
  const isSingleFullSlice = parts.length === 1;
  const attivo = activeIdx !== null ? parts[activeIdx] : null;
  // Al click, mostra il banner circolare nel foro centrale e avvia un timer che lo nasconde dopo
  // 3,5s (ricliccando sullo stesso spicchio lo si chiude subito; cliccando su un altro il timer riparte).
  const toggleSlice = (i) => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setActiveIdx((prev) => {
      const next = prev === i ? null : i;
      if (next !== null) timerRef.current = setTimeout(() => setActiveIdx(null), 3500);
      return next;
    });
  };
  React.useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  return (
    <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-start" }}>
      <div style={{ position: "relative", overflow: "visible", width: 260, height: 260, flexShrink: 0 }}>
        <svg width="260" height="260" viewBox="0 0 260 260" style={{ overflow: "visible" }}>
          {total <= 0 ? (
            <circle cx={cx} cy={cy} r={rOuter} fill="none" stroke="#EDE9E0" strokeWidth={rOuter - rInner} />
          ) : isSingleFullSlice ? (
            <path
              d={donutFullRingPath(cx, cy, activeIdx === 0 ? rOuter + 8 : rOuter, rInner)}
              fill={parts[0].color}
              fillRule="evenodd"
              style={{ transition: "d 0.2s ease-out", cursor: "pointer" }}
              onClick={() => toggleSlice(0)}
            />
          ) : (
            parts.map((p, i) => (
              <path
                key={i}
                d={donutArcPath(cx, cy, activeIdx === i ? rOuter + 8 : rOuter, rInner, p.start, p.end)}
                fill={p.color}
                stroke={activeIdx === i ? "#fff" : "rgba(255,255,255,0.6)"}
                strokeWidth={activeIdx === i ? "3" : "2"}
                style={{ transition: "d 0.2s ease-out", cursor: "pointer" }}
                onClick={() => toggleSlice(i)}
              />
            ))
          )}
        </svg>
        {/* Foro centrale: di default il Capitale Totale. Al click di uno spicchio, il totale
            scompare temporaneamente e al suo posto compare il banner circolare con i dati dello
            spicchio; scaduto il timer (3,5s) il totale viene ripristinato automaticamente. */}
        {attivo ? (
          <DonutCenterBanner
            key={activeIdx}
            rInner={rInner}
            color={attivo.color}
            name={attivo.label}
            pct={attivo.fraction * 100}
            importo={attivo.importo}
          />
        ) : (
          <div className="donut-center">
            <div className="donut-center-eyebrow">Capitale Totale</div>
            <div className="donut-center-pct">{eur(total)}</div>
          </div>
        )}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {parts.map((p, i) => (
          <div
            key={i}
            style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}
            onClick={() => toggleSlice(i)}
          >
            <span className="swatch" style={{ background: p.color }}></span>
            <span>{p.label} — <strong>{(p.fraction * 100).toFixed(1)}%</strong> ({eur(p.importo)})</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Anello unico di allocazione: mappato sui singoli comparti realmente presenti in portafoglio
// (es. GESAV, Ri.Alto, Mondo Azionario...). Gli spicchi GS partono dal polo superiore e crescono
// verso sinistra (senso antiorario), gli spicchi MR partono dallo stesso polo superiore e crescono
// verso destra (senso orario): le due macro-aree occupano quindi sempre l'emisfero sinistro/destro
// e si ricongiungono esattamente al polo inferiore, qualunque sia il peso reciproco GS/MR. Le
// singole celle hanno solo un sottile bordo bianco di separazione (1,5px): il bordo marcato di
// macro-area è un UNICO arco di contorno esterno per blocco (niente stroke spesso sulle celle, per
// evitare la doppia linea e lo "spacco" interno). Il foro centrale è vuoto di default; al click su
// uno spicchio compare un banner circolare interno (nome, percentuale, importo) che scompare con
// dissolvenza dopo 3,5 secondi, riportando il foro allo stato vuoto.
const COLORE_GS = "#2C699A";
const COLORE_MR = "#16DB93"; // Verde Menta

// Arco "di solo contorno" (nessun riempimento a settore): usato per l'inviluppo esterno unico che
// racchiude visivamente l'intero blocco GS a sinistra e l'intero blocco MR a destra.
function arcOutlinePath(cx, cy, r, startAngle, endAngle) {
  const startPt = polarToCartesian(cx, cy, r, endAngle);
  const endPt = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = Math.abs(endAngle - startAngle) <= 180 ? "0" : "1";
  return ["M", startPt.x, startPt.y, "A", r, r, 0, largeArcFlag, 0, endPt.x, endPt.y].join(" ");
}

function AllocazioneUnificataDonut({ items, totaleGS, totaleMR }) {
  const total = totaleGS + totaleMR;
  const cx = 130, cy = 130, rOuter = 110, rInner = 62;
  const [activeIdx, setActiveIdx] = useState(null);
  const timerRef = useRef(null);

  // GS: dal polo superiore (0°) verso sinistra, in senso antiorario (angoli negativi).
  let cumGS = 0;
  const gsParts = items.filter((it) => it.tipo === "gs").map((s) => {
    const fraction = total > 0 ? s.importo / total : 0;
    const end = cumGS;
    const start = cumGS - fraction * 360;
    cumGS = start;
    return { ...s, fraction, start, end, mid: (start + end) / 2 };
  });
  // MR: dallo stesso polo superiore (0°) verso destra, in senso orario (angoli positivi).
  let cumMR = 0;
  const mrParts = items.filter((it) => it.tipo === "mr").map((s) => {
    const fraction = total > 0 ? s.importo / total : 0;
    const start = cumMR;
    const end = cumMR + fraction * 360;
    cumMR = end;
    return { ...s, fraction, start, end, mid: (start + end) / 2 };
  });
  const parts = [...gsParts, ...mrParts];
  // Fix bug "comparto singolo (100%)": un solo spicchio pari all'intera circonferenza degenera in
  // un arco SVG a estremi coincidenti (invisibile). In questo caso disegna un anello pieno.
  const isSingleFullSlice = parts.length === 1;
  const attivo = activeIdx !== null ? parts[activeIdx] : null;
  const fractionGS = total > 0 ? totaleGS / total : 0;
  const pctGS = (fractionGS * 100).toFixed(1);
  const pctMR = (100 - fractionGS * 100).toFixed(1);

  // Al click, mostra il banner circolare interno del comparto e avvia un timer che lo nasconde
  // dopo 3,5s (ricliccando sullo stesso spicchio lo si chiude subito; cliccando su un altro il
  // timer riparte).
  const toggleSlice = (i) => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setActiveIdx((prev) => {
      const next = prev === i ? null : i;
      if (next !== null) timerRef.current = setTimeout(() => setActiveIdx(null), 3500);
      return next;
    });
  };
  React.useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  return (
    <div>
      {/* Etichette macro-area in alto alla card: percentuale aggregata GS (sinistra) e MR (destra),
          colore coordinato con il contorno della rispettiva macro-area. */}
      <div style={{ display: "flex", justifyContent: "space-between", padding: "0 6px", marginBottom: 4 }}>
        <span style={{ fontWeight: 800, fontSize: 14, color: COLORE_GS }}>GS {pctGS}%</span>
        <span style={{ fontWeight: 800, fontSize: 14, color: COLORE_MR }}>MR {pctMR}%</span>
      </div>
      <div style={{ position: "relative", overflow: "visible", width: 260, height: 260, margin: "0 auto" }}>
        <svg width="260" height="260" viewBox="0 0 260 260" style={{ overflow: "visible" }}>
          {total <= 0 ? (
            <circle cx={cx} cy={cy} r={rOuter} fill="none" stroke="#EDE9E0" strokeWidth={rOuter - rInner} />
          ) : isSingleFullSlice ? (
            <>
              <path
                d={donutFullRingPath(cx, cy, activeIdx === 0 ? rOuter + 8 : rOuter, rInner)}
                fill={parts[0].color}
                fillRule="evenodd"
                style={{ transition: "d 0.2s ease-out", cursor: "pointer" }}
                onClick={() => toggleSlice(0)}
              />
              <circle cx={cx} cy={cy} r={rOuter + 4} fill="none" stroke={parts[0].tipo === "gs" ? COLORE_GS : COLORE_MR} strokeWidth="3" />
            </>
          ) : (
            <>
              {/* Celle del donut: solo un sottile bordo bianco di separazione (niente stroke spesso
                  qui, per evitare la doppia linea rispetto all'arco di inviluppo esterno). */}
              {parts.map((p, i) => (
                <path
                  key={i}
                  d={donutArcPath(cx, cy, activeIdx === i ? rOuter + 8 : rOuter, rInner, p.start, p.end)}
                  fill={p.color}
                  stroke="#FFFFFF"
                  strokeWidth="1.5"
                  style={{ transition: "d 0.2s ease-out", cursor: "pointer" }}
                  onClick={() => toggleSlice(i)}
                />
              ))}
              {/* Inviluppo esterno: un UNICO arco continuo di solo contorno per blocco, staccato di
                  4px dal bordo del donut (cuscinetto bianco), che racchiude l'intero blocco GS
                  (sinistra) e l'intero blocco MR (destra). */}
              {gsParts.length > 0 && (
                <path d={arcOutlinePath(cx, cy, rOuter + 4, cumGS, 0)} fill="none" stroke={COLORE_GS} strokeWidth="3.5" strokeLinecap="round" />
              )}
              {mrParts.length > 0 && (
                <path d={arcOutlinePath(cx, cy, rOuter + 4, 0, cumMR)} fill="none" stroke={COLORE_MR} strokeWidth="3.5" strokeLinecap="round" />
              )}
            </>
          )}
        </svg>
        {/* Foro centrale: vuoto di default (nessun testo statico). Al click su uno spicchio compare
            il banner circolare con nome/percentuale/importo del comparto, che scompare con
            dissolvenza dopo 3,5s riportando il foro allo stato vuoto. */}
        {attivo && (
          <DonutCenterBanner
            key={activeIdx}
            rInner={rInner}
            color={attivo.color}
            name={attivo.label}
            pct={attivo.fraction * 100}
            importo={attivo.importo}
          />
        )}
      </div>
    </div>
  );
}

// ---------- Line chart (hand-built SVG, N series) ----------
function GrowthChart({ series, maxYear, labels, colors, scadenzeAnni, puntiReali }) {
  const wrapRef = useRef(null);
  const [hover, setHover] = useState(null);
  const [hoverScadenza, setHoverScadenza] = useState(null);
  const [hoverReale, setHoverReale] = useState(null);
  const W = 760, H = 340;
  const pad = { top: 20, right: 24, bottom: 34, left: 78 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  const allVals = series.flat().map((d) => d.total).concat((puntiReali || []).filter(Boolean).map((p) => p.y));
  const maxVal = Math.max(1, ...allVals) * 1.08;
  const xScale = (year) => pad.left + (maxYear === 0 ? 0 : (year / maxYear) * plotW);
  const yScale = (val) => pad.top + plotH - (val / maxVal) * plotH;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * maxVal);
  const xTickCount = Math.min(maxYear, 6) || 1;
  const xTicks = Array.from({ length: xTickCount + 1 }, (_, i) => Math.round((i * maxYear) / xTickCount));

  const handleMove = (e) => {
    const rect = wrapRef.current.getBoundingClientRect();
    const relX = ((e.clientX - rect.left) / rect.width) * W;
    const yearRaw = ((relX - pad.left) / plotW) * maxYear;
    const year = Math.min(maxYear, Math.max(0, Math.round(yearRaw)));
    setHover({ year, x: xScale(year) });
  };

  return (
    <div style={{ position: "relative" }} ref={wrapRef} onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
      <div className="chart-legend">
        {labels.map((l, i) => (
          <span key={i}><i style={{ background: colors[i] }}></i>{l}</span>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {yTicks.map((t, idx) => (
          <g key={idx}>
            <line x1={pad.left} x2={W - pad.right} y1={yScale(t)} y2={yScale(t)} stroke="#EDE9E0" />
            <text x={pad.left - 8} y={yScale(t) + 4} textAnchor="end" fontSize="11" fill="#948B78">{eur(t)}</text>
          </g>
        ))}
        {xTicks.map((yr, idx) => (
          <text key={idx} x={xScale(yr)} y={H - pad.bottom + 18} textAnchor="middle" fontSize="11" fill="#948B78">{yr}a</text>
        ))}
        <line x1={pad.left} x2={pad.left} y1={pad.top} y2={H - pad.bottom} stroke="#D8D2C4" />
        <line x1={pad.left} x2={W - pad.right} y1={H - pad.bottom} y2={H - pad.bottom} stroke="#D8D2C4" />

        <defs>
          {series.map((s, i) => (
            <linearGradient key={`grad-${i}`} id={`areaGrad-${i}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%" stopColor={colors[i]} stopOpacity="0.25" />
              <stop offset="95%" stopColor={colors[i]} stopOpacity="0" />
            </linearGradient>
          ))}
        </defs>

        {series.map((s, i) => {
          const dLine = s.map((row, j) => `${j === 0 ? "M" : "L"}${xScale(row.year).toFixed(2)},${yScale(row.total).toFixed(2)}`).join(" ");
          const baseline = H - pad.bottom;
          const dArea = `${dLine} L${xScale(s[s.length - 1].year).toFixed(2)},${baseline} L${xScale(s[0].year).toFixed(2)},${baseline} Z`;
          return <path key={`area-${i}`} d={dArea} fill={`url(#areaGrad-${i})`} stroke="none" />;
        })}
        {series.map((s, i) => {
          const d = s.map((row, j) => `${j === 0 ? "M" : "L"}${xScale(row.year).toFixed(2)},${yScale(row.total).toFixed(2)}`).join(" ");
          return <path key={i} d={d} fill="none" stroke={colors[i]} strokeWidth="2.5" style={{ d: `path("${d}")`, transition: "d 0.5s ease", filter: `drop-shadow(0 2px 3px ${colors[i]}66)` }} />;
        })}

        {/* Linea di riferimento "Scadenza Contrattuale Target": la curva prosegue oltre (prodotto a
            vita intera), la linea rossa tratteggiata marca solo il punto di osservazione contrattuale. */}
        {Array.isArray(scadenzeAnni) && scadenzeAnni.map((anni, i) => {
          if (!Number.isFinite(anni) || anni <= 0 || anni > maxYear) return null;
          const x = xScale(anni);
          return (
            <g
              key={`scad-${i}`}
              onMouseEnter={() => setHoverScadenza({ i, x, anni })}
              onMouseLeave={() => setHoverScadenza(null)}
              style={{ cursor: "pointer" }}
            >
              <line x1={x} x2={x} y1={pad.top} y2={H - pad.bottom} stroke="#C23B3B" strokeWidth="1.5" strokeDasharray="5 4" opacity="0.8" />
              <circle cx={x} cy={pad.top} r="3.5" fill="#C23B3B" />
            </g>
          );
        })}

        {/* Punto "Consuntivo / Controllo Reale": valore reale da estratto conto, riportato sulla
            curva teorica (che resta invariata) come marker distinto, per confronto visivo. */}
        {Array.isArray(puntiReali) && puntiReali.map((p, i) => {
          if (!p || !Number.isFinite(p.x) || p.x < 0 || p.x > maxYear) return null;
          const x = xScale(p.x);
          const y = yScale(p.y);
          return (
            <g
              key={`reale-${i}`}
              onMouseEnter={() => setHoverReale({ i, x, y, ...p })}
              onMouseLeave={() => setHoverReale(null)}
              style={{ cursor: "pointer" }}
            >
              <rect x={x - 4.5} y={y - 4.5} width="9" height="9" fill="#fff" stroke={colors[i]} strokeWidth="2" transform={`rotate(45 ${x} ${y})`} />
            </g>
          );
        })}

        {hover && (
          <line x1={hover.x} x2={hover.x} y1={pad.top} y2={H - pad.bottom} stroke="#C8C2B4" strokeDasharray="3 3" />
        )}
        {hover && series.map((s, i) => {
          const row = s.find((r) => r.year === hover.year);
          if (!row) return null;
          return <circle key={i} cx={hover.x} cy={yScale(row.total)} r="4" fill={colors[i]} stroke="#fff" strokeWidth="1.5" />;
        })}
      </svg>
      {hover && (
        <div className="chart-tooltip" style={{ left: `${(hover.x / W) * 100}%`, top: "6%" }}>
          <div>Anno {hover.year}</div>

// Grafico a data reale per il "Portafoglio Complessivo": asse X categoriale (un punto per ogni data
// della timeline assoluta, spaziatura uniforme per indice — non proporzionale ai giorni), etichette
// in formato gg/mm/aaaa. Punti: [{ dataYMD, totale }, ...]. Componente separato da GrowthChart per
// non toccare il grafico "Dettaglio Prodotti" (che resta su anni relativi da T0 di ciascun prodotto).
function formatDataIt(ymd) {
  const [y, m, d] = ymd.split("-");
  return `${d}/${m}/${y}`;
}
function GrowthChartAssoluto({ points, label, color, scadenze }) {
  const wrapRef = useRef(null);
  const [hover, setHover] = useState(null);
  const [hoverScadenza, setHoverScadenza] = useState(null);
  const W = 760, H = 340;
  const pad = { top: 20, right: 24, bottom: 34, left: 78 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;
  const n = points.length;

  const maxVal = Math.max(1, ...points.map((p) => p.totale)) * 1.08;
  const xScale = (i) => pad.left + (n <= 1 ? 0 : (i / (n - 1)) * plotW);
  const yScale = (val) => pad.top + plotH - (val / maxVal) * plotH;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * maxVal);
  const xTickStep = Math.max(1, Math.ceil(n / 7));
  const xTickIdx = Array.from({ length: Math.ceil((n - 1) / xTickStep) + 1 }, (_, i) => Math.min(n - 1, i * xTickStep));

  const handleMove = (e) => {
    const rect = wrapRef.current.getBoundingClientRect();
    const relX = ((e.clientX - rect.left) / rect.width) * W;
    const idxRaw = n <= 1 ? 0 : ((relX - pad.left) / plotW) * (n - 1);
    const idx = Math.min(n - 1, Math.max(0, Math.round(idxRaw)));
    setHover({ idx, x: xScale(idx) });
  };

  const d = points.map((p, j) => `${j === 0 ? "M" : "L"}${xScale(j).toFixed(2)},${yScale(p.totale).toFixed(2)}`).join(" ");

  // Marcatori di scadenza contrattuale target: la curva è ora cadenzata solo al 31/12 di ogni anno
  // (nessun nodo a data esatta), quindi la posizione della scadenza si interpola linearmente fra il
  // 31/12 dell'anno precedente e il 31/12 dell'anno stesso, in proporzione alla frazione d'anno
  // trascorsa — la linea resta un riferimento visivo, non altera i dati della curva.
  const scadenzeConIndice = (scadenze || [])
    .map((s) => {
      const annoTarget = parseYMD(s.dataYMD).y;
      const idxAnnoStesso = points.findIndex((p) => parseYMD(p.dataYMD).y === annoTarget);
      if (idxAnnoStesso === -1) return { ...s, idx: -1 };
      const idxAnnoPrec = idxAnnoStesso - 1;
      const dataInizioAnno = idxAnnoPrec >= 0 ? points[idxAnnoPrec].dataYMD : `${annoTarget - 1}-12-31`;
      const frazione = Math.min(1, Math.max(0, calcolaAnniFrazionariMensili(dataInizioAnno, s.dataYMD)));
      return { ...s, idx: Math.max(0, idxAnnoPrec + frazione) };
    })
    .filter((s) => s.idx >= 0);

  return (
    <div style={{ position: "relative" }} ref={wrapRef} onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
      <div className="chart-legend">
        <span><i style={{ background: color }}></i>{label}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {yTicks.map((t, idx) => (
          <g key={idx}>
            <line x1={pad.left} x2={W - pad.right} y1={yScale(t)} y2={yScale(t)} stroke="#EDE9E0" />
            <text x={pad.left - 8} y={yScale(t) + 4} textAnchor="end" fontSize="11" fill="#948B78">{eur(t)}</text>
          </g>
        ))}
        {xTickIdx.map((idx) => (
          <text key={idx} x={xScale(idx)} y={H - pad.bottom + 18} textAnchor="middle" fontSize="10.5" fill="#948B78">
            {points[idx] ? formatDataIt(points[idx].dataYMD) : ""}
          </text>
        ))}
        <line x1={pad.left} x2={pad.left} y1={pad.top} y2={H - pad.bottom} stroke="#D8D2C4" />
        <line x1={pad.left} x2={W - pad.right} y1={H - pad.bottom} y2={H - pad.bottom} stroke="#D8D2C4" />

        <defs>
          <linearGradient id="areaGradAssoluto" x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor={color} stopOpacity="0.25" />
            <stop offset="95%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={`${d} L${xScale(n - 1).toFixed(2)},${H - pad.bottom} L${xScale(0).toFixed(2)},${H - pad.bottom} Z`} fill="url(#areaGradAssoluto)" stroke="none" />
        <path d={d} fill="none" stroke={color} strokeWidth="2.5" style={{ d: `path("${d}")`, transition: "d 0.5s ease", filter: `drop-shadow(0 2px 3px ${color}66)` }} />

        {/* Linee di riferimento "Scadenza Contrattuale Target" per ciascun prodotto attivo: la curva
            aggregata prosegue oltre (prodotti a vita intera), qui si marca solo il punto contrattuale. */}
        {scadenzeConIndice.map((s, i) => (
          <g
            key={`scad-${i}`}
            onMouseEnter={() => setHoverScadenza(s)}
            onMouseLeave={() => setHoverScadenza(null)}
            style={{ cursor: "pointer" }}
          >
            <line x1={xScale(s.idx)} x2={xScale(s.idx)} y1={pad.top} y2={H - pad.bottom} stroke="#C23B3B" strokeWidth="1.5" strokeDasharray="5 4" opacity="0.8" />
            <circle cx={xScale(s.idx)} cy={pad.top} r="3.5" fill="#C23B3B" />
          </g>
        ))}

        {hover && (
          <line x1={hover.x} x2={hover.x} y1={pad.top} y2={H - pad.bottom} stroke="#C8C2B4" strokeDasharray="3 3" />
        )}
        {hover && points[hover.idx] && (
          <circle cx={hover.x} cy={yScale(points[hover.idx].totale)} r="4" fill={color} stroke="#fff" strokeWidth="1.5" />
        )}
      </svg>
      {hover && points[hover.idx] && (
        <div className="chart-tooltip" style={{ left: `${(hover.x / W) * 100}%`, top: "6%" }}>
          <div>{formatDataIt(points[hover.idx].dataYMD)}</div>
          <div>{label}: {eur(points[hover.idx].totale)}</div>
        </div>
      )}
      {hoverScadenza && (
        <div className="chart-tooltip" style={{ left: `${(xScale(hoverScadenza.idx) / W) * 100}%`, top: "6%" }}>
          <div><strong>Scadenza Contrattuale Target</strong></div>
          <div>{hoverScadenza.label}: {formatDataIt(hoverScadenza.dataYMD)}</div>
        </div>
      )}
    </div>
  );
}

// ---------- Accordion (finestra collassabile riutilizzabile) ----------
function Accordion({ title, headerExtra, defaultOpen = false, className = "", children }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className={`accordion ${className}`.trim()}>
      <div className="accordion-header" onClick={() => setOpen((o) => !o)}>
        <span className="accordion-caret">{open ? "▼" : "▶"}</span>
        <h3 className="accordion-title">{title}</h3>
        {headerExtra && (
          <div className="accordion-extra" onClick={(e) => e.stopPropagation()}>
            {headerExtra}
          </div>
        )}
      </div>
      <div className={open ? "accordion-body-wrap open" : "accordion-body-wrap"}>
        <div className="accordion-body-inner">
          <div className="accordion-body">{children}</div>
        </div>
      </div>
    </div>
  );
}

function TimeframeSelector({ value, onChange }) {
  return (
    <div className="timeframe-seg">
      {[5, 10, 15, 20].map((y) => (
        <button key={y} type="button" className={value === y ? "timeframe-btn active" : "timeframe-btn"} onClick={() => onChange(y)}>
          {y} anni
        </button>
      ))}
    </div>
  );
}

function StoricoRow({ row, onUpdate, onRemove, timeframeYears, useRowTimeframe }) {
  const update = (field, value) => onUpdate(row.id, { ...row, [field]: value });
  const updateYear = (i, value) => {
    const next = row.rendimenti.slice();
    next[i] = value;
    update("rendimenti", next);
  };
  const addYear = () => update("rendimenti", [...row.rendimenti, 0]);
  const toggleExpanded = () => update("expanded", !row.expanded);
  const effectiveTimeframe = useRowTimeframe ? clampTimeframe(row.orizzonteCagr) : timeframeYears;
  // Anteprima nell'appendice: nessun prodotto/T0 specifico associato, si ancora all'anno corrente
  // (equivalente a "come se investissi oggi"). Il calcolo reale per ciascun prodotto si ancora
  // invece alla sua data di investimento (vedi resolveRateGS / getHoldingComponents).
  const annoFineFinestra = annoFineFinestraOggi();
  const cagr = cagrFromReturns(row.rendimenti, effectiveTimeframe, row.annoPiuRecente, annoFineFinestra);
  const anniUsati = effectiveYearsUsed(row.rendimenti, effectiveTimeframe, row.annoPiuRecente, annoFineFinestra);

  return (
    <div className="storico-row">
      <div className="storico-row-head">
        <button className="storico-expand" onClick={toggleExpanded} title={row.expanded ? "Comprimi" : "Espandi"}>
          {row.expanded ? "▾" : "▸"}
        </button>
        <input
          type="text"
          className="storico-name"
          value={row.nome}
          placeholder="es. Mondo Azionario"
          onChange={(e) => update("nome", e.target.value)}
        />
        <div className="storico-anno-recente" onClick={(e) => e.stopPropagation()}>
          <span>Ultimo anno</span>
          <NumField min={2000} max={2100} step={1} value={row.annoPiuRecente} onChange={(v) => update("annoPiuRecente", Math.round(v))} />
        </div>
        {useRowTimeframe && (
          <TimeframeSelector value={clampTimeframe(row.orizzonteCagr)} onChange={(y) => update("orizzonteCagr", y)} />
        )}
        <div className="storico-cagr">CAGR ({anniUsati}a, anteprima anno corrente) <strong>{cagr.toFixed(2)}%</strong></div>
        <span className="storico-years-count">{row.rendimenti.length} anni in archivio</span>
        <button className="storico-remove" onClick={() => onRemove(row.id)} title="Rimuovi comparto">×</button>
      </div>
      {row.expanded && (
        <div className="storico-years">
          <div className="storico-years-grid">
            {row.rendimenti.map((val, i) => (
              <div key={i} className="storico-year-cell">
                <div className="storico-year-label">{annoImplicito(row.rendimenti, row.annoPiuRecente, i)}</div>
                <div className="input-row small">
                  <NumField min={-100} max={100} step={0.1} value={val} onChange={(v) => updateYear(i, v)} />
                  <span className="suffix">%</span>
                </div>
              </div>
            ))}
          </div>
          <button className="add-year-btn" onClick={addYear}>+ Aggiungi Annualità Successiva</button>
        </div>
      )}
    </div>
  );
}

function AppendixStorico({ rows, setRows, timeframeYears, onTimeframeChange, title, hint, addLabel, emptyLabel, showTimeframeSelector, perRowTimeframe }) {
  const update = (id, next) => setRows((prev) => prev.map((r) => (r.id === id ? next : r)));
  const remove = (id) => setRows((prev) => prev.filter((r) => r.id !== id));
  const add = () => setRows((prev) => [...prev, defaultStoricoRow()]);

  return (
    <Accordion
      title={title}
      headerExtra={showTimeframeSelector ? <TimeframeSelector value={timeframeYears} onChange={onTimeframeChange} /> : null}
      defaultOpen={false}
      className="no-print"
    >
      <p className="hint">{hint}</p>
      {rows.length === 0 ? (
        <p className="empty-note">{emptyLabel}</p>
      ) : (
        <div className="storico-list">
          {rows.map((r) => (
            <StoricoRow key={r.id} row={r} onUpdate={update} onRemove={remove} timeframeYears={timeframeYears} useRowTimeframe={perRowTimeframe} />
          ))}
        </div>
      )}
      <button className="add-row-btn" onClick={add}>{addLabel}</button>
    </Accordion>
  );
}

function normalizeComparti(list) {
  if (!Array.isArray(list) || list.length === 0) return [defaultCompartoConfig({ pct: 50 })];
  return list.map((c) =>
    defaultCompartoConfig({
      nomeComparto: typeof c.nomeComparto === "string" ? c.nomeComparto : "",
      tipo: c.tipo === "gs" ? "gs" : "mr",
      pct: Number.isFinite(Number(c.pct)) ? Number(c.pct) : 0,
      anniCagr: clampTimeframe(c.anniCagr),
      ott: Number.isFinite(Number(c.ott)) ? Number(c.ott) : DEFAULT_SCENARI_MR.ottimista,
      mod: Number.isFinite(Number(c.mod)) ? Number(c.mod) : DEFAULT_SCENARI_MR.potenziale,
      pru: Number.isFinite(Number(c.pru)) ? Number(c.pru) : DEFAULT_SCENARI_MR.prudente,
      deltaOtt: Number.isFinite(Number(c.deltaOtt)) ? Number(c.deltaOtt) : 0,
      deltaMod: Number.isFinite(Number(c.deltaMod)) ? Number(c.deltaMod) : 0,
      deltaPru: Number.isFinite(Number(c.deltaPru)) ? Number(c.deltaPru) : 0,
    })
  );
}

// Migrazione dal vecchio schema (1 solo comparto Multiramo: compartoNome/mrOtt/mrMod/mrPru)
// verso il nuovo schema a lista dinamica di comparti.
function migrateProdottoConfigRow(r) {
  if (Array.isArray(r.comparti)) return r;
  const out = { ...r };
  out.gsAssociata = out.gsAssociata !== undefined ? out.gsAssociata : true;
  if (r.compartoNome !== undefined || r.mrOtt !== undefined) {
    out.comparti = [
      defaultCompartoConfig({
        nomeComparto: r.compartoNome || "",
        pct: 100 - (Number(r.gsPct) || 0),
        ott: Number.isFinite(Number(r.mrOtt)) ? Number(r.mrOtt) : DEFAULT_SCENARI_MR.ottimista,
        mod: Number.isFinite(Number(r.mrMod)) ? Number(r.mrMod) : DEFAULT_SCENARI_MR.potenziale,
        pru: Number.isFinite(Number(r.mrPru)) ? Number(r.mrPru) : DEFAULT_SCENARI_MR.prudente,
      }),
    ];
  }
  delete out.compartoNome;
  delete out.mrOtt;
  delete out.mrMod;
  delete out.mrPru;
  return out;
}

function normalizeProdottiList(list) {
  if (!Array.isArray(list)) return [];
  return list.map((r0) => {
    const r = migrateProdottoConfigRow(r0);
    return defaultProdottoConfigRow({
      id: typeof r.id === "string" && r.id ? r.id : nextId("p"),
      nomeProdotto: typeof r.nomeProdotto === "string" ? r.nomeProdotto : "",
      permetteVersamenti: r.permetteVersamenti !== undefined ? !!r.permetteVersamenti : false,

      gsAssociata: r.gsAssociata !== undefined ? !!r.gsAssociata : true,
