<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compositore di Portafoglio — Analisi Composizione</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#C8102E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Compositore Portafoglio" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #F7F5F1;
    color: #1C1C1C;
  }
  .app-root { min-height: 100vh; padding: 20px; }

  .top-bar-banner {
    width: 100%; height: 5px; border-radius: 3px; background: #C8102E; margin-bottom: 10px;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    margin-bottom: 18px; background: #FFFFFF; padding: 16px 22px; border-radius: 8px; border: 1px solid #E3DED5; box-shadow: 0 2px 8px rgba(28,28,28,0.06);
  }
  .top-bar h1 { font-family: ui-serif, Georgia, "Times New Roman", serif; font-size: 25px; font-weight: 800; letter-spacing: -0.01em; margin: 0; color: #1E293B; }
  .top-bar p { margin: 2px 0 0; color: #6B7280; font-size: 13px; }
  .print-btn { background: #000000; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.02em; }
  .print-btn:hover { background: #262626; }
  .print-date-note { font-size: 11px; color: rgba(0,0,0,0.65); margin-top: 6px; }
  .print-export-row { text-align: right; margin-bottom: 18px; }
  .sezioni-stampa-box { background: #FBFAF7; border: 1px solid #E3DED5; border-radius: 6px; padding: 9px 14px; margin-bottom: 18px; }
  .sezioni-stampa-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .sezioni-stampa-titolo { font-size: 11px; font-weight: 700; color: #6B6558; text-transform: uppercase; letter-spacing: 0.03em; flex: 1 1 auto; }
  .sezioni-stampa-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #E3DED5; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .sezioni-stampa-check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #1C1C1C; cursor: pointer; white-space: nowrap; }
  .sezioni-stampa-check input { cursor: pointer; }
  .sync-box { background: #FBFAF7; border: 1px solid #E3DED5; border-radius: 6px; padding: 9px 14px; margin-bottom: 18px; }
  .sync-box-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .sync-box-stato { font-size: 12.5px; color: #6B6558; flex: 1 1 auto; }
  .sync-toggle-btn { background: none; border: 1px solid #D8D2C4; border-radius: 4px; padding: 4px 10px; font-size: 11.5px; color: #6B6558; cursor: pointer; }
  .sync-toggle-btn:hover { background: #F1EEE7; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #C8C2B4; }
  .sync-dot-synced { background: #2F6F5E; }
  .sync-dot-syncing { background: #B4592B; animation: pulseSync 1s ease-in-out infinite; }
  .sync-dot-error { background: #B3261E; }
  .sync-dot-offline { background: #C8C2B4; }
  @keyframes pulseSync { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .sync-box-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #E3DED5; }
  .print-only-date { display: none; }
  @media print {
    .print-only-date { display: block; font-size: 11px; color: #6B6558; margin: 14px 0 0; }
  }

  .holdings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

  .panel { background: #FFFFFF; border: 1px solid #E3DED5; border-top: 3px solid var(--accent); border-radius: 6px; padding: 18px 20px 20px; position: relative; }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .panel-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .panel-head h2 { font-family: ui-serif, Georgia, serif; font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  .remove-btn { border: none; background: transparent; color: #948B78; font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .remove-btn:hover { color: #C8102E; }

  .badge { margin-bottom: 16px; }
  .badge-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #6B6558; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .value-pill { background: #F1EEE7; color: #1C1C1C; padding: 1px 8px; border-radius: 20px; font-size: 11px; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 6px; }
  .value-pill.pill-error { background: #FBE7E7; color: #B3261E; }
  .locked-pill { background: #F1EEE7; color: #8A6D3B; padding: 1px 8px; border-radius: 20px; font-size: 10.5px; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .select-prompt { font-size: 12px; color: #B4592B; background: #FBF3F0; border-radius: 4px; padding: 8px 10px; margin: -6px 0 16px; }
  .holding-component { border: 1px solid #E3DED5; border: 1px solid color-mix(in srgb, var(--accent) 22%, #E3DED5); border-radius: 8px; padding: 10px; background: #FBFAF7; background: color-mix(in srgb, var(--accent) 10%, #FFFFFF); margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .holding-component-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .holding-component-head .prodcfg-text { flex: 1 1 140px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(28,28,28,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: #fff; border-radius: 8px; padding: 22px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .save-default-btn { background: #2F6F5E; color: #fff; border: none; border-radius: 4px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .save-default-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .riscatto-list { display: flex; flex-direction: column; gap: 6px; }
  .riscatto-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #6B6558; }
  .riscatto-row input { width: 56px; }

  select, .input-row input { font-family: inherit; }
  select.select-field {
    width: 100%; padding: 8px 10px; border: 1px solid #E3DED5; border-radius: 4px;
    background: #FBFAF7; font-size: 13.5px; color: #1C1C1C;
  }

  .input-row { display: flex; align-items: center; border: 1px solid #E3DED5; border-radius: 4px; background: #FBFAF7; padding: 6px 10px; }
  .input-row.small { max-width: 150px; }
  .input-row .prefix, .input-row .suffix { color: #6B6558; font-size: 13px; }
  .input-row input { border: none; background: transparent; font-size: 15px; font-variant-numeric: tabular-nums; width: 100%; padding: 0 6px; outline: none; }

  .slider { width: 100%; accent-color: var(--accent); }
  .slider:disabled { accent-color: #C8C2B4; opacity: 0.6; }

  .comp-row { display: flex; justify-content: space-between; font-size: 11.5px; color: #6B6558; margin-top: 4px; }
  .comp-row-edit { align-items: center; gap: 10px; }
  .comp-field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .comp-input { max-width: 100%; }
  .comp-input input { text-align: right; }

  .rate-badge { display: flex; gap: 14px; flex-wrap: wrap; }
  .rate-col { flex: 1; min-width: 130px; }

  .mr-source { margin-top: 6px; }
  .mr-readout { font-size: 12px; color: #6B6558; margin-top: 4px; }
  .mr-readout strong { color: #1C1C1C; }
  .scenario-hint { font-size: 10.5px; color: #948B78; margin-top: 5px; line-height: 1.4; }
  .cagr-warning { color: #B4592B; font-size: 10.5px; }

  .layer2-toggle { margin-bottom: 12px; }
  .layer2-btn { width: 100%; padding: 9px 10px; border: 1px dashed #C8C2B4; background: #FBFAF7; border-radius: 4px; font-size: 12.5px; font-weight: 600; color: #6B6558; cursor: pointer; }
  .layer2-btn.active { border-style: solid; border-color: var(--accent); background: #FBF3F0; color: var(--accent); }
  .layer2-control { display: flex; align-items: center; gap: 8px; }
  .layer2-control .layer2-btn { flex: 1 1 auto; width: auto; }
  .layer2-switch { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: #6B6558; white-space: nowrap; cursor: pointer; }
  .layer2-switch input { cursor: pointer; }
  .incluso-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #6B6558; background: #F1EEE7; padding: 3px 9px; border-radius: 20px; cursor: pointer; margin-left: auto; margin-right: 8px; }
  .incluso-toggle input { cursor: pointer; }
  .date-field { border: 1px solid #E3DED5; border-radius: 4px; padding: 7px 9px; font-size: 13px; background: #FBFAF7; width: 100%; }
  .date-field-small { width: auto; padding: 4px 6px; font-size: 12px; }
  .consuntivo-date-input { width: 100%; max-width: 280px; padding: 10px; font-size: 14px; }
  .non-previsto-tag { font-size: 12px; font-weight: 600; color: #948B78; background: #F1EEE7; padding: 4px 10px; border-radius: 4px; display: inline-block; }
  .scadenza-hint { font-size: 11px; color: #948B78; margin-top: 6px; }
  .layer2-block { border-top: 1px solid #EDE9E0; padding-top: 14px; margin-top: 2px; }
  .cost-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .cost-cell-wide { grid-column: 1 / -1; }
  .cost-label { font-size: 11.5px; color: #6B6558; margin-bottom: 4px; }
  .cost-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cost-hint { font-size: 10.5px; color: #948B78; margin-top: 3px; }
  .mini-seg { display: flex; gap: 4px; }
  .mini-seg-btn { padding: 2px 9px; border: 1px solid #E3DED5; background: #FBFAF7; border-radius: 3px; font-size: 11px; font-weight: 600; cursor: pointer; color: #6B6558; }
  .mini-seg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ins-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #1C1C1C; margin-top: 14px; cursor: pointer; }
  .ins-check-inline { margin-top: 0; font-size: 11px; white-space: nowrap; }
  .nd-tag { font-size: 11.5px; font-weight: 600; color: #B3261E; background: #FBE7E7; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .consuntivo-box { margin-top: 10px; border: 1px solid #E3DED5; border-radius: 6px; padding: 10px 12px; background: #FBFAF7; display: flex; flex-direction: column; gap: 6px; }
  .consuntivo-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #6B6558; gap: 10px; }
  .consuntivo-positivo { color: #2F6F5E; }
  .consuntivo-negativo { color: #B3261E; }
  .ins-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ins-badge { font-size: 11px; background: #F1EEE7; color: #4A4536; padding: 4px 9px; border-radius: 20px; }

  .add-product-btn {
    margin-top: 16px; width: 100%; padding: 14px; border: 2px dashed #C8C2B4; background: transparent;
    border-radius: 6px; font-size: 13.5px; font-weight: 600; color: #6B6558; cursor: pointer;
  }
  .add-product-btn:hover { border-color: #C8102E; color: #C8102E; }

  .section { margin-top: 22px; }
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .section-grid { grid-template-columns: 1fr; } }

  .chart-card { background: #FFFFFF; border: 1px solid #E3DED5; border-radius: 6px; padding: 16px 20px 12px; position: relative; }
  .chart-card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
  .chart-card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .chart-card-head .mini-seg-btn.active { background: #1F3A5F; border-color: #1F3A5F; color: #fff; }
  .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-bottom: 8px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: rgba(20,20,24,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #fff; padding: 9px 12px; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    border-radius: 8px; font-size: 11.5px; line-height: 1.5; transform: translate(-50%, -110%); white-space: nowrap; z-index: 5;
  }

  .donut-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px; width: 110px;
  }
  .donut-center-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #948B78; }
  .donut-center-pct { font-size: 19px; font-weight: 700; color: #1C1C1C; line-height: 1.15; }
  .donut-center-label { font-size: 10.5px; color: #6B6558; margin-top: 3px; white-space: normal; line-height: 1.25; }
  .donut-center-value { font-size: 12px; color: #1C1C1C; font-weight: 600; margin-top: 1px; }
  /* Banner circolare interno: sostituisce il testo di default nel foro dell'anello quando uno
     spicchio è selezionato. Cerchio perfetto coordinato all'innerRadius, sfondo/bordo del colore
     dello spicchio; compare e scompare con dissolvenza + leggero scale nell'arco dei 3,5s
     (key=activeIdx forza il remount, riavviando l'animazione). */
  @keyframes centerBannerFade {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
    10% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); }
  }
  .donut-center-banner {
    position: absolute; top: 50%; left: 50%; border-radius: 50%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 6px; border-width: 2px; border-style: solid; animation: centerBannerFade 3.5s ease-out forwards;
  }
  .donut-center-banner-nome { font-size: 11.5px; font-weight: 700; line-height: 1.25; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-center-banner-pct { font-size: 16px; font-weight: 800; color: #1E293B; margin-top: 3px; line-height: 1.1; }
  .donut-center-banner-val { font-size: 10.5px; font-weight: 700; color: #1E293B; opacity: 0.82; margin-top: 2px; }

  /* Griglia principale delle due card di allocazione (Composizione Portafoglio + Allocazione GS/MR):
     nessuna altezza fissa sulle card, allineamento "stretch" così che, quando la legenda sottostante
     cresce, entrambe le card si estendono simultaneamente alla stessa altezza. */
  .allocation-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
  @media (max-width: 820px) { .allocation-cards-grid { grid-template-columns: 1fr; } }
  .alloc-card { display: flex; flex-direction: column; }
  .alloc-card-body { flex: 1 0 auto; }

  /* Legenda bicolonna sotto l'anello unificato: colonna sinistra Gestione Separata, colonna destra
     Multiramo, ciascuna con intestazione (colore macro) e l'elenco dei singoli comparti/quote. */
  .allocazione-legend-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .alloc-legend-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .alloc-legend-head { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .alloc-legend-row { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }
  .alloc-legend-row .swatch { flex-shrink: 0; }
  .alloc-legend-row span.alloc-legend-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alloc-legend-empty { font-size: 11.5px; color: #948B78; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel { animation: fadeInUp 0.2s ease-out; }
  .layer2-btn, .save-default-btn, .add-row-btn, .mini-seg-btn, .remove-btn, .storico-remove { transition: all 0.2s ease-in-out; }

  .table-card { background: #FFFFFF; border: 1px solid #E3DED5; border-radius: 6px; padding: 16px 20px; margin-top: 16px; overflow-x: auto; }
  .table-card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
  table.summary { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.summary th, table.summary td { text-align: right; padding: 8px 10px; border-bottom: 1px solid #EDE9E0; font-variant-numeric: tabular-nums; }
  table.summary th:first-child, table.summary td:first-child { text-align: left; font-variant-numeric: normal; }
  table.summary thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #6B6558; font-weight: 600; }
  table.summary tbody tr:hover { background: #FBFAF7; }
  table.summary tfoot td { font-weight: 700; border-top: 2px solid #D8D2C4; border-bottom: none; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }
  .net-tag { font-size: 9.5px; text-transform: uppercase; color: #8A6D3B; background: #F1EEE7; border-radius: 8px; padding: 1px 6px; margin-left: 6px; }
  .scenario-legend { font-size: 11px; color: #948B78; margin: 10px 0 0; line-height: 1.5; }

  .accordion { background: #FFFFFF; border: 1px solid #E3DED5; border-radius: 6px; margin-top: 22px; overflow: hidden; }
  .accordion-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; cursor: pointer; user-select: none; flex-wrap: wrap; }
  .accordion-caret { font-size: 11px; color: #6B6558; width: 14px; flex-shrink: 0; }
  .accordion-title { flex: 1; margin: 0; font-size: 15px; font-weight: 700; font-family: ui-serif, Georgia, serif; min-width: 200px; }
  .accordion-extra { display: flex; align-items: center; gap: 8px; }
  .accordion-body-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  .accordion-body-wrap.open { grid-template-rows: 1fr; }
  .accordion-body-inner { overflow: hidden; }
  .accordion-body { padding: 0 20px 18px; }

  .timeframe-seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .timeframe-btn { padding: 5px 10px; border: 1px solid #E3DED5; background: #FBFAF7; border-radius: 4px; font-size: 11px; font-weight: 600; color: #6B6558; cursor: pointer; white-space: nowrap; }
  .timeframe-btn.active { background: #1F3A5F; border-color: #1F3A5F; color: #fff; }

  .io-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 20px; flex-wrap: wrap; margin-top: 22px; }
  .io-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border: 1px solid #E3DED5; border-radius: 6px; background: #FBFAF7; }
  .io-group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #6B6558; font-weight: 700; margin-right: 4px; }
  .io-btn { padding: 8px 14px; border: 1px solid #E3DED5; background: #FBFAF7; border-radius: 4px; font-size: 12px; font-weight: 600; color: #6B6558; cursor: pointer; white-space: nowrap; }
  .io-btn:hover { border-color: #1F3A5F; color: #1F3A5F; }
  .import-msg { font-size: 12px; padding: 8px 10px; border-radius: 4px; margin: 8px 0 0; }
  .import-msg.ok { background: #F0F5F3; color: #2F6F5E; }
  .import-msg.error { background: #FBF0F0; color: #C8102E; }

  .appendix p.hint { font-size: 12px; color: #6B6558; margin: 0 0 12px; }
  .storico-list { display: flex; flex-direction: column; gap: 10px; }
  .storico-row { border: 1px solid #E3DED5; border-radius: 6px; overflow: hidden; }
  .storico-row-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #FBFAF7; flex-wrap: wrap; }
  .storico-expand { border: none; background: transparent; font-size: 13px; color: #6B6558; cursor: pointer; width: 18px; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef } = React;

// ---------- formatting ----------
const eur = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0, useGrouping: true }).format(Number.isFinite(n) ? n : 0);

// Numero animato ("count-up"): quando il valore cambia (es. si modificano i costi o si aggiunge un
// versamento), l'importo scorre dal vecchio al nuovo valore in ~350ms invece di scattare all'istante.
function AnimatedEur({ value }) {
  const [display, setDisplay] = useState(Number.isFinite(value) ? value : 0);
  const prevRef = useRef(display);
  React.useEffect(() => {
    const from = prevRef.current;
    const to = Number.isFinite(value) ? value : 0;
    if (from === to) return;
    const start = performance.now();
    const duration = 350;
    let raf;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const current = from + (to - from) * eased;
      setDisplay(current);
      if (t < 1) {
        raf = requestAnimationFrame(step);
      } else {
        prevRef.current = to;
      }
    };
    raf = requestAnimationFrame(step);
    return () => raf && cancelAnimationFrame(raf);
  }, [value]);
  return <>{eur(display)}</>;
}
const pct = (n) => `${Number.isFinite(n) ? n.toFixed(1) : "0.0"}%`;

// Campo numerico che risolve il bug "0 fisso / cifre doppie": mantiene uno stato testuale
// locale disaccoppiato dal valore numerico del genitore, così il campo può restare vuoto
// mentre l'utente digita, mostrando "0" solo come placeholder grigio.
// Campo dedicato agli scenari KID: step 0.01, accetta sia virgola sia punto come separatore
// decimale, formatta in sola lettura a 2 cifre decimali fisse.
function ScenarioField({ value, onChange, disabled = false }) {
  const [text, setText] = useState(Number.isFinite(value) ? String(value) : "");
  const prevValue = useRef(value);

  React.useEffect(() => {
    if (value !== prevValue.current) {
      prevValue.current = value;
      setText(Number.isFinite(value) ? String(value) : "");
    }
  }, [value]);

  const handleChange = (e) => {
    const raw = e.target.value;
    setText(raw);
    const normalized = raw.replace(",", ".");
    const num = parseFloat(normalized);
    if (!Number.isNaN(num)) {
      prevValue.current = num;
      onChange(num);
    }
  };

  const handleBlur = () => {
    const normalized = text.replace(",", ".");
    let num = parseFloat(normalized);
    if (Number.isNaN(num)) num = 0;
    num = Math.round(num * 100) / 100;
    prevValue.current = num;
    setText(num.toFixed(2));
    onChange(num);
  };

  return (
    <input
      type="text"
      inputMode="decimal"
      className="scenario-input"
      placeholder="0,00"
      value={text}
      disabled={disabled}
      onChange={handleChange}
      onBlur={handleBlur}
    />
  );
}

function NumField({ value, onChange, min, max, step = 1, placeholder = "0", className = "", disabled = false }) {
  const [text, setText] = useState(value === 0 || value === undefined || value === null ? "" : String(value));
  const prevValue = useRef(value);

  React.useEffect(() => {
    if (value !== prevValue.current) {
      prevValue.current = value;
      setText(value === 0 ? "" : String(value));
    }
  }, [value]);

  const handleChange = (e) => {
    const raw = e.target.value;
    setText(raw);
    if (raw === "") {
      prevValue.current = 0;
      onChange(0);
      return;
    }
    const num = Number(raw);
    if (!Number.isNaN(num)) {
      prevValue.current = num;
      onChange(num);
    }
  };

  const handleBlur = () => {
    let num = text === "" ? 0 : Number(text);
    if (Number.isNaN(num)) num = 0;
    if (min !== undefined) num = Math.max(min, num);
    if (max !== undefined) num = Math.min(max, num);
    prevValue.current = num;
    setText(num === 0 ? "" : String(num));
    onChange(num);
  };

  return (
    <input
      type="number"
      inputMode="decimal"
      className={className}
      placeholder={placeholder}
      min={min}
      max={max}
      step={step}
      value={text}
      disabled={disabled}
      onChange={handleChange}
      onBlur={handleBlur}
    />
  );
}

// Campo per importi in euro: mostra il separatore delle migliaia (punto, stile it-IT) mentre
// l'utente digita — es. "10000" -> "10.000" — ma comunica al genitore sempre il valore numerico
// puro (nessuna stringa formattata finisce mai nello stato/nei grafici).
function formatMigliaia(n) {
  return Number.isFinite(n) && n !== 0 ? new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0, useGrouping: true }).format(n) : "";
}
function CurrencyField({ value, onChange, min, max, disabled = false, placeholder = "0" }) {
  const [text, setText] = useState(formatMigliaia(value));
  const prevValue = useRef(value);

  React.useEffect(() => {
    if (value !== prevValue.current) {
      prevValue.current = value;
      setText(formatMigliaia(value));
    }
  }, [value]);

  const handleChange = (e) => {
    const digits = e.target.value.replace(/[^\d]/g, "");
    const num = digits === "" ? 0 : parseInt(digits, 10);
    prevValue.current = num;
    setText(digits === "" ? "" : new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0, useGrouping: true }).format(num));
    onChange(num);
  };

  const handleBlur = () => {
    let num = prevValue.current || 0;
    if (min !== undefined) num = Math.max(min, num);
    if (max !== undefined) num = Math.min(max, num);
    prevValue.current = num;
    setText(formatMigliaia(num));
    onChange(num);
  };

  return (
    <input
      type="text"
      inputMode="numeric"
      placeholder={placeholder}
      value={text}
      disabled={disabled}
      onChange={handleChange}
      onBlur={handleBlur}
    />
  );
}

// ---------- product catalog ----------
// PLACEHOLDER: range di composizione (min/max % Gestione Separata) non ancora confermati.
// Quando avrai i vincoli reali per ciascun prodotto, aggiorna solo i valori gsMin/gsMax/gsDefault qui sotto.
const CUSTOM_KEY = "__custom__";
const PRODUCT_CATALOG = {
  "RINNOVA VALORE BONUS": { gsMin: 0, gsMax: 100, gsDefault: 50 },
  "GENERAZIONE INVESTIMENTO": { gsMin: 0, gsMax: 100, gsDefault: 50 },
  "GENERAZIONE SVILUPPO SOSTENIBILE": { gsMin: 0, gsMax: 100, gsDefault: 50 },
  "VALORE FUTURO": { gsMin: 0, gsMax: 100, gsDefault: 50 },
};
const PRODUCT_NAMES = Object.keys(PRODUCT_CATALOG);

// Nuova Palette Colori Dashboard — assegnata dinamicamente a prodotti e comparti.
const PALETTE = [
  "#2C699A", // Blu Oceano
  "#048BA8", // Ottanio / Turchese scuro
  "#0DB39E", // Verde Smeraldo
  "#16DB93", // Verde Menta
  "#83E377", // Verde Chiaro
  "#B9E769", // Verde Lime
  "#EFEA5A", // Giallo Chiaro
  "#F1C453", // Giallo Ambra
  "#F29E4C", // Arancione Warm
];
const colorFor = (idx) => PALETTE[idx % PALETTE.length];
const getColoreElemento = (idx) => PALETTE[idx % PALETTE.length];
const slotLabel = (idx) => (idx < 26 ? `Prodotto ${String.fromCharCode(65 + idx)}` : `Prodotto #${idx + 1}`);

let idCounter = 0;
const nextId = (prefix) => `${prefix}-${idCounter++}`;

function defaultCompartoHolding(overrides) {
  return {
    id: nextId("hc"),
    nomeComparto: "",
    tipo: "mr", // "mr" (Comparto Multiramo, default) | "gs" (Gestione Separata aggiuntiva, oltre allo slot GS singolo)
    multiramoFonte: "manuale",
    rateMRManuale: 5,
    anniCagr: 10, // orizzonte CAGR indipendente per questo comparto (5/10/15/20), separato dal timeframe globale
    pct: 50,
    ott: DEFAULT_SCENARI_MR.ottimista,
    mod: DEFAULT_SCENARI_MR.potenziale,
    pru: DEFAULT_SCENARI_MR.prudente,
    deltaOtt: 0, // scostamento (punti percentuali) rispetto al CAGR storico/manuale, modalità "CAGR"
    deltaMod: 0,
    deltaPru: 0,
    ...overrides,
  };
}

// ---------- factories ----------
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function defaultVersamento(overrides) {
  return { id: nextId("v"), data: dataOggiFineMese(), importo: 0, ...overrides };
}
function defaultPrelievo(overrides) {
  return { id: nextId("pr"), data: dataOggiFineMese(), tipo: "parziale", importoLordo: 0, ...overrides };
}

function defaultHolding(overrides) {
  return {
    id: nextId("h"),
    nomeKey: "",
    nomeCustom: "",
    importo: 10000,
    anni: 15,
    dataInvestimento: dataOggiFineMese(),
    inclusoInPortafoglio: true,
    permetteVersamenti: false,
    flussiVersamenti: [], // [{ id, data, importo }] — versamenti aggiuntivi oltre al capitale iniziale
    permettePrelievi: true,
    flussiPrelievi: [], // [{ id, data, tipo: 'parziale'|'totale', importoLordo }]
    gsAssociata: true,
    gsPct: 50,
    gsFonte: "manuale",
    rateGSManuale: 2,
    gsOtt: DEFAULT_SCENARI_GS.ottimista,
    gsMod: DEFAULT_SCENARI_GS.potenziale,
    gsPru: DEFAULT_SCENARI_GS.prudente,
    gsDeltaOtt: 0,
    gsDeltaMod: 0,
    gsDeltaPru: 0,
    comparti: [defaultCompartoHolding({ pct: 50 })],
    layer2: false,
    costiConfigurati: false, // true dopo la prima configurazione (via preset o manuale); rende visibile l'interruttore lordo/netto
    caricamentoTipo: "percentuale",
    caricamentoPct: 0,
    caricamentoUnitario: 0,
    costiGestioneComponenti: {}, // { gs: pct, [compartoId]: pct }
    riscattoSchedule: [], // [{ anno, percentuale }]
    performanceFee: 0,
    aliquota: 26,
    tipoImponibile: "plusvalenza", // "plusvalenza" (default, tassa solo il guadagno) | "intero" (tassa l'intero importo riscattato al netto della penale)
    prodottoAssicurativo: true,
    consuntivoData: "", // data_controllo (libera, da estratto conto)
    consuntivoValoreLordo: 0, // valore_lordo_reale
    consuntivoNote: "",
    ...overrides,
  };
}

// Migrazione da schema precedente (1 solo comparto Multiramo, costi flat GS/Comparto, penale di
// uscita unica) verso lo schema attuale (N comparti dinamici, costi per componente via id, piano
// di penali di riscatto per anno, data di investimento reale, versamenti aggiuntivi).
function migrateHolding(h) {
  const out = { ...h };
  if (out.rateGSManuale === undefined && out.rateGS !== undefined) {
    out.rateGSManuale = out.rateGS;
  }
  if (out.gsFonte === undefined) out.gsFonte = "manuale";
  if (out.costiConfigurati === undefined) out.costiConfigurati = !!out.layer2;
  if (out.gsAssociata === undefined) out.gsAssociata = true;
  if (out.gsOtt === undefined) out.gsOtt = DEFAULT_SCENARI_GS.ottimista;
  if (out.gsMod === undefined) out.gsMod = DEFAULT_SCENARI_GS.potenziale;
  if (out.gsPru === undefined) out.gsPru = DEFAULT_SCENARI_GS.prudente;
  out.dataInvestimento = normalizeDataFineMese(out.dataInvestimento || todayISO());
  if (out.inclusoInPortafoglio === undefined) out.inclusoInPortafoglio = true;
  if (out.permetteVersamenti === undefined) out.permetteVersamenti = false;
  out.flussiVersamenti = Array.isArray(out.flussiVersamenti)
    ? out.flussiVersamenti.map((v) => ({ ...v, data: normalizeDataFineMese(v.data) }))
    : [];
  if (out.permettePrelievi === undefined) out.permettePrelievi = true;
  if (out.tipoImponibile === undefined) out.tipoImponibile = "plusvalenza";
  if (out.consuntivoData === undefined) out.consuntivoData = "";
  if (out.consuntivoValoreLordo === undefined) out.consuntivoValoreLordo = 0;
  if (out.consuntivoNote === undefined) out.consuntivoNote = "";
  out.flussiPrelievi = Array.isArray(out.flussiPrelievi)
    ? out.flussiPrelievi.map((p) => ({ ...p, data: normalizeDataFineMese(p.data) }))
    : [];

  if (!Array.isArray(out.comparti)) {
    out.comparti = [
      defaultCompartoHolding({
        nomeComparto: "",
        multiramoFonte: out.multiramoFonte !== undefined ? out.multiramoFonte : "manuale",
        rateMRManuale: out.rateMRManuale !== undefined ? out.rateMRManuale : 5,
        pct: 100 - (Number(out.gsPct) || 0),
      }),
    ];
  }
  // Garantisce i campi Δ CAGR anche sui comparti già esistenti (creati prima dell'introduzione della
  // doppia riga di scenari CAGR/KID).
  out.comparti = out.comparti.map((c) => ({
    deltaOtt: 0,
    deltaMod: 0,
    deltaPru: 0,
    anniCagr: 10,
    tipo: "mr",
    ...c,
  }));
  if (out.gsDeltaOtt === undefined) out.gsDeltaOtt = 0;
  if (out.gsDeltaMod === undefined) out.gsDeltaMod = 0;
  if (out.gsDeltaPru === undefined) out.gsDeltaPru = 0;

  if (!out.costiGestioneComponenti) {
    const legacyGS = out.costoGestioneGS;
    const legacyMR = out.costoGestioneComparto ?? out.gestioneAnnua;
    out.costiGestioneComponenti = {};
    if (legacyGS !== undefined) out.costiGestioneComponenti.gs = legacyGS;
    if (legacyMR !== undefined && out.comparti[0]) out.costiGestioneComponenti[out.comparti[0].id] = legacyMR;
  }

  if (!Array.isArray(out.riscattoSchedule)) {
    out.riscattoSchedule = out.costoUscita ? [{ anno: 1, percentuale: out.costoUscita }] : [];
  }

  delete out.rateGS;
  delete out.gestioneAnnua;
  delete out.multiramoFonte;
  delete out.rateMRManuale;
  delete out.costoGestioneGS;
  delete out.costoGestioneComparto;
  delete out.costoUscita;
  return out;
}

function defaultStoricoRow(overrides) {
  return { id: nextId("s"), nome: "", rendimenti: Array(10).fill(0), expanded: true, orizzonteCagr: 10, annoPiuRecente: new Date().getFullYear() - 1, ...overrides };
}
function clampTimeframe(v) {
  return [5, 10, 15, 20].includes(Number(v)) ? Number(v) : 10;
}

// ---------- persistenza LocalStorage (nessun backend: dati solo nel browser) ----------
const STORAGE_KEY = "calcolatrice_multiramo_data";

function normalizeStoricoList(list) {
  if (!Array.isArray(list)) return [];
  return list.map((r) =>
    defaultStoricoRow({
      id: typeof r.id === "string" && r.id ? r.id : nextId("s"),
      nome: typeof r.nome === "string" ? r.nome : "",
      rendimenti: Array.isArray(r.rendimenti) && r.rendimenti.length > 0 ? r.rendimenti.map(Number) : Array(10).fill(0),
      orizzonteCagr: clampTimeframe(r.orizzonteCagr),
      annoPiuRecente: Number.isFinite(Number(r.annoPiuRecente)) ? Number(r.annoPiuRecente) : new Date().getFullYear() - 1,
      expanded: false,
    })
  );
}

function seedDefaultProdotti() {
  return Object.keys(PRODUCT_CATALOG).map((name) => defaultProdottoConfigRow({ nomeProdotto: name, gsPct: PRODUCT_CATALOG[name].gsDefault }));
}

function defaultCostiPredefinitiRow(overrides) {
  return {
    id: nextId("cp"),
    prodottoId: "",
    expanded: false,
    caricamentoTipo: "percentuale",
    caricamentoPct: 0,
    caricamentoUnitario: 0,
    riscattoSchedule: [],
    performanceFee: 0,
    aliquota: 26,
    tipoImponibile: "plusvalenza",
    prodottoAssicurativo: true,
    gestioneComponenti: {},
    ...overrides,
  };
}
// nomeProdottiConfig: lista prodottiConfig corrente, usata solo per migrare i vecchi profili
// salvati con "nomeProdotto" (stringa) verso il nuovo collegamento stabile per "prodottoId".
function normalizeCostiPredefinitiList(list, prodottiConfigForMigration) {
  if (!Array.isArray(list)) return [];
  return list.map((r) => {
    let prodottoId = typeof r.prodottoId === "string" ? r.prodottoId : "";
    const idRisolveAUnProdotto = prodottoId && prodottiConfigForMigration && prodottiConfigForMigration.some((p) => p.id === prodottoId);
    if (!idRisolveAUnProdotto && typeof r.nomeProdotto === "string" && r.nomeProdotto && prodottiConfigForMigration) {
      const match = prodottiConfigForMigration.find((p) => p.nomeProdotto === r.nomeProdotto);
      if (match) prodottoId = match.id;
    }
    return defaultCostiPredefinitiRow({
      prodottoId,
      caricamentoTipo: r.caricamentoTipo === "unitario" ? "unitario" : "percentuale",
      caricamentoPct: Number.isFinite(Number(r.caricamentoPct)) ? Number(r.caricamentoPct) : 0,
      caricamentoUnitario: Number.isFinite(Number(r.caricamentoUnitario)) ? Number(r.caricamentoUnitario) : 0,
      riscattoSchedule: Array.isArray(r.riscattoSchedule) ? r.riscattoSchedule.map((e) => ({ anno: Number(e.anno) || 1, percentuale: Number(e.percentuale) || 0, bloccato: !!e.bloccato })) : [],
      performanceFee: Number.isFinite(Number(r.performanceFee)) ? Number(r.performanceFee) : 0,
      aliquota: Number.isFinite(Number(r.aliquota)) ? Number(r.aliquota) : 26,
      tipoImponibile: r.tipoImponibile === "intero" ? "intero" : "plusvalenza",
      prodottoAssicurativo: r.prodottoAssicurativo !== undefined ? !!r.prodottoAssicurativo : true,
      gestioneComponenti: r.gestioneComponenti && typeof r.gestioneComponenti === "object" ? r.gestioneComponenti : {},
    });
  });
}

function loadAppendicesFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { storico: [], storicoGS: [], prodotti: seedDefaultProdotti(), costiPredefiniti: [], _salvatoIl: null };
    const parsed = JSON.parse(raw);
    const storicoList = Array.isArray(parsed.appendice_rendimenti) ? parsed.appendice_rendimenti : (Array.isArray(parsed) ? parsed : parsed.comparti);
    const storicoGSList = Array.isArray(parsed.appendice_rendimenti_gs) ? parsed.appendice_rendimenti_gs : [];
    const prodottiList = Array.isArray(parsed.appendice_prodotti) ? parsed.appendice_prodotti : [];
    const costiList = Array.isArray(parsed.appendice_costi_predefiniti) ? parsed.appendice_costi_predefiniti : [];
    const nextProdotti = normalizeProdottiList(prodottiList);
    return {
      storico: normalizeStoricoList(storicoList),
      storicoGS: normalizeStoricoList(storicoGSList),
      prodotti: nextProdotti,
      costiPredefiniti: normalizeCostiPredefinitiList(costiList, nextProdotti),
      _salvatoIl: typeof parsed.salvatoIl === "string" ? parsed.salvatoIl : null,
    };
  } catch (e) {
    console.warn("Impossibile leggere i dati salvati:", e);
    return { storico: [], storicoGS: [], prodotti: seedDefaultProdotti(), costiPredefiniti: [], _salvatoIl: null };
  }
}

function persistAppendicesToStorage(storico, storicoGS, prodotti, costiPredefiniti) {
  try {
    const payload = buildAppendicesPayload(storico, storicoGS, prodotti, costiPredefiniti);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.warn("Impossibile salvare i dati:", e);
  }
}

// ---------- Sincronizzazione appendici su Google Sheet (via Apps Script Web App) ----------
// Solo le quattro appendici (struttura portante) passano di qui. Le schede prodotto (holdings)
// non toccano mai questo livello: restano locali alla sessione, salvabili solo con "Esporta
// Configurazione" — esattamente come oggi, nessun cambiamento lì.
const SYNC_CONFIG_KEY = "calcolatrice_multiramo_sync_config";

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (!raw) return { url: "", token: "" };
    const parsed = JSON.parse(raw);
    return { url: typeof parsed.url === "string" ? parsed.url : "", token: typeof parsed.token === "string" ? parsed.token : "" };
  } catch (e) {
    return { url: "", token: "" };
  }
}
function saveSyncConfig(config) {

    localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config));
  } catch (e) {
